<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pounce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  :root{--ink:#0e0718;--prism:#5fe3c6;--gold:#ffd166;
        /* --gold is reassigned to the team accent on every level, so anything in
           the surround that must stay gold reads this instead. Without it the
           frame sparkles took the away team's colour and blinked light blue. */
        --frame-gold:#ffd166;
        --sl:env(safe-area-inset-left,0px);  --sr:env(safe-area-inset-right,0px);
        --st:env(safe-area-inset-top,0px);   --sb:env(safe-area-inset-bottom,0px);
        /* breathing room so nothing interactive sits against a screen edge or an
           OS edge-swipe zone */
        --inset:max(18px,2.4vmin);
        --fit:.92}
  /* phones need every pixel; big screens can afford a wider frame */
  @media (max-width:820px){:root{--fit:.98;--inset:max(10px,1.4vmin)}}
  @media (min-width:1800px){:root{--fit:.90}}
  /* touch devices (any orientation): drop the card look entirely and run edge
     to edge, still yielding to a notch or home-indicator via the safe-area vars */
  @media (pointer:coarse){:root{--fit:1;--inset:0px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{background:#07040e;color:#f6eeff;font-family:'Outfit',system-ui,sans-serif;
       display:flex;align-items:center;justify-content:center;
       -webkit-tap-highlight-color:transparent;touch-action:none}
  /* the surround: a lacquered harlequin in purple and gold */
  #frame{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
         background:#05020a}
  #harlequin{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* one sheen band across the whole surround. Laid over the pattern rather than
     baked into the tile, so it reads as a single sweep of light on a lacquered
     surface instead of the same highlight stamped out every tile. */
  #gloss{position:absolute;inset:0;
         background:linear-gradient(114deg,
           transparent 14%, rgba(255,255,255,.045) 31%, rgba(255,231,170,.07) 40%,
           rgba(255,255,255,.028) 49%, transparent 66%)}
  /* purple pooling at the foot, then a hard falloff outward so the pattern is
     brightest where it meets the stage and sinks to black at the screen edge */
  #glow{position:absolute;inset:0;
        background:
          radial-gradient(70% 44% at 50% 112%, rgba(96,42,180,.26), transparent 74%),
          radial-gradient(92% 70% at 50% 50%, transparent 30%, rgba(0,0,0,.86) 100%)}
  .spark{position:absolute;border-radius:50%;background:#fff;
         animation:tw var(--d) ease-in-out infinite alternate;opacity:.25}
  .spark.gold{background:var(--frame-gold)}
  @keyframes tw{from{opacity:.10;transform:scale(.7)}to{opacity:.85;transform:scale(1.15)}}
  #stage{position:relative;z-index:1;aspect-ratio:7/4;touch-action:none;
         /* --fit pulls the play area in from the edges so the frame has real presence
            and nothing interactive sits in an OS edge-swipe zone */
         width:calc(min(
           calc(100vw - (var(--inset)*2 + var(--sl) + var(--sr))),
           calc((100vh - (var(--inset)*2 + var(--st) + var(--sb))) * 7 / 4)
         ) * var(--fit));
         border-radius:clamp(12px,1.6vmin,26px);overflow:hidden;
         box-shadow:0 30px 90px rgba(0,0,0,.75),
                    0 0 0 1px rgba(255,255,255,.07),
                    0 0 0 3px rgba(10,6,20,.9),
                    0 0 44px -6px rgba(0,0,0,.8),
                    0 0 0 1px rgba(255,209,102,.30) inset}
  @supports (color:color-mix(in srgb, red 50%, transparent)){
    #stage{box-shadow:0 30px 90px rgba(0,0,0,.75),
                      0 0 0 1px rgba(255,255,255,.07),
                      0 0 0 3px rgba(10,6,20,.9),
                      0 0 44px -6px rgba(0,0,0,.8),
                      0 0 0 1px color-mix(in srgb, var(--gold) 34%, transparent) inset}
  }
  /* on touch devices the stage IS the screen: no card edge to show off */
  @media (pointer:coarse){
    #stage{border-radius:0;box-shadow:none}
  }
  canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;inset:0;pointer-events:none;padding:16px 18px;
       display:flex;flex-direction:column;justify-content:space-between}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .plate{background:rgba(14,7,24,.6);backdrop-filter:blur(7px);
         border:1px solid rgba(255,255,255,.16);border-radius:12px;
         padding:8px 13px;pointer-events:auto}
  .eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
  #lvlkicker{max-width:30ch;line-height:1.4}
  .title{font-family:'Fraunces',Georgia,serif;font-weight:900;
         font-size:clamp(15px,2.1vw,22px);line-height:1.15;letter-spacing:-.01em}
  .lvlhint{font-size:11px;color:#c3aede;margin-top:3px;max-width:26ch;line-height:1.3;
           opacity:0;transition:opacity .5s}
  .lvlhint.show{opacity:1}
  .horns{display:flex;gap:5px;margin-top:5px;justify-content:flex-end}
  .horn{width:19px;height:12px;border-radius:50%;position:relative;
        background:linear-gradient(160deg,#b06a30,#6b3c18);
        box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
  .horn::after{content:'';position:absolute;left:50%;top:50%;width:9px;height:2px;border-radius:1px;
        background:rgba(255,250,240,.92);transform:translate(-50%,-50%)}
  .horn.spent{background:rgba(255,255,255,.14);box-shadow:none}
  .horn.spent::after{background:rgba(255,255,255,.22)}
  .score{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(17px,2.4vw,26px);
         text-align:right;line-height:1}
  .rec{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
       text-align:right;margin-top:5px;color:#b9a6d6}
  .rec b{color:var(--gold)}
    .plays{display:flex;flex-wrap:wrap;gap:max(4px,calc(clamp(6px,1vmin,11px)*var(--ts)));
           justify-content:center;margin:0 0 var(--cardgap)}
  .card .eyebrow{font-size:max(9px,calc(clamp(10px,1.55vmin,15px)*var(--ts)))}
  .card .btn{font-size:max(12px,calc(clamp(13px,1.95vmin,19px)*var(--ts)));border-radius:12px;
             padding:max(7px,calc(clamp(10px,1.5vmin,15px)*var(--ts)))
                     max(13px,calc(clamp(17px,2.6vmin,32px)*var(--ts)))}
  .playchip{display:flex;align-items:center;gap:6px;font-weight:700;
            font-size:max(10px,calc(clamp(10.5px,1.6vmin,15px)*var(--ts)));
            background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.17);
            border-radius:9px;white-space:nowrap;
            padding:max(3px,calc(clamp(4px,.75vmin,9px)*var(--ts)))
                    max(7px,calc(clamp(9px,1.35vmin,16px)*var(--ts)))}
  .playchip i{font-style:normal;color:var(--gold);line-height:1;
              font-size:max(12px,calc(clamp(13px,2vmin,19px)*var(--ts)))}
  .howto{color:#d6c6ef;background:rgba(255,209,102,.10);
         font-size:max(11px,calc(clamp(12px,1.85vmin,17px)*var(--ts)));
         border:1px solid rgba(255,209,102,.30);border-radius:12px;
         padding:max(5px,calc(clamp(8px,1.35vmin,15px)*var(--ts)))
                 max(9px,calc(clamp(12px,1.9vmin,22px)*var(--ts)));
         margin:0 auto var(--cardgap);max-width:74ch;line-height:1.4}
  .howto b{color:var(--gold)}
  .lvl.win{border-color:rgba(120,240,170,.75)}
  .lvl.loss{opacity:.62}
  .power{display:flex;align-items:center;gap:11px;min-width:220px}
  .glyph{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;
         background:linear-gradient(140deg,rgba(95,227,198,.28),rgba(255,143,196,.28));
         border:1px solid rgba(255,255,255,.22)}
  .pname{font-weight:800;font-size:14px}
  .phint{font-size:11px;color:#c3aede;margin-top:1px}
  .btn{font-family:'Outfit',sans-serif;font-weight:700;font-size:13px;color:var(--ink);
       background:linear-gradient(140deg,var(--gold),#f5a26b);border:none;padding:10px 17px;
       border-radius:10px;cursor:pointer;pointer-events:auto}
  .btn.ghost{background:transparent;color:#f6eeff;border:1px solid rgba(255,255,255,.3)}
  .btn:hover{filter:brightness(1.08)}
  .btn:focus-visible{outline:3px solid var(--prism);outline-offset:3px}
  .iconbtn{width:36px;height:36px;padding:0;display:grid;place-items:center;font-size:15px}
  .veil{position:absolute;inset:0;display:none;place-items:center;pointer-events:auto;z-index:5;
        padding:clamp(8px,2.2vmin,22px);
        background:radial-gradient(circle at 50% 42%,rgba(40,24,66,.88),rgba(8,4,16,.96))}
  .veil.on{display:grid}
  /* --ts is the type scale. fitCard measures the room and steps it down in tiers.
     Every size below is wrapped in max() so the scale can never drive text under
     its legible floor; when shrinking runs out, the tiers hide rows instead. */
  .card{text-align:center;max-width:min(940px,94%);width:100%;--cardgap:14px;--ts:1}
  .card[data-tier="1"]{--ts:.90}
  .card[data-tier="2"]{--ts:.82}
  .card[data-tier="3"]{--ts:.76}
  .card[data-tier="4"]{--ts:.70}
  /* What each tier gives up, in the order it hurts least. The how-to box holds the
     one rule a new player cannot guess, so it survives every tier. */
  .card:is([data-tier="2"],[data-tier="3"],[data-tier="4"]) .plays{display:none}
  .card:is([data-tier="3"],[data-tier="4"]) .subtitle{display:none}
  .card[data-tier="4"] .lvl small{display:none}
  .card h1{font-family:'Fraunces',serif;font-weight:900;
           font-size:max(20px,calc(clamp(34px,7.4vmin,82px)*var(--ts)));
           line-height:.95;letter-spacing:-.02em}
  .card h1 em{font-style:normal;color:var(--gold)}
  .card p{color:#cbb7e6;margin:0 auto var(--cardgap);max-width:70ch;
          font-size:max(11.5px,calc(clamp(14px,2.05vmin,20px)*var(--ts)));line-height:1.5}
  .card h1{margin:0 0 var(--cardgap)}
  .card .subtitle{margin:0 0 var(--cardgap);letter-spacing:.28em;opacity:.95}
  /* the trailing track after the last letter would shove the word off-centre,
     so the same amount is given back as indent */
  .card h1.gametitle{text-transform:uppercase;letter-spacing:.115em;text-indent:.115em}
  .stars{font-size:max(20px,calc(clamp(30px,5.4vmin,52px)*var(--ts)));
         letter-spacing:calc(10px*var(--ts));margin:0 0 var(--cardgap);color:var(--gold)}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);
        gap:max(4px,calc(clamp(7px,1.1vmin,13px)*var(--ts)));margin:0}
  .card{max-height:calc(100% - 8px);overflow-y:auto;overscroll-behavior:contain}
  .lvl{border-radius:12px;border:1px solid rgba(255,255,255,.22);
       color:#f6eeff;cursor:pointer;display:flex;flex-direction:column;align-items:center;
       justify-content:center;gap:max(1px,calc(clamp(2px,.35vmin,5px)*var(--ts)));
       padding:max(3px,calc(clamp(5px,.9vmin,11px)*var(--ts))) 4px;overflow:hidden}
  .lvl b{font-family:'Fraunces',serif;font-weight:900;
         font-size:max(13px,calc(clamp(17px,2.7vmin,30px)*var(--ts)));line-height:1}
  .lvl small{font-size:max(7.5px,calc(clamp(8px,1.3vmin,13px)*var(--ts)));
             letter-spacing:.06em;opacity:.85;text-align:center;line-height:1.15}
  .lvl i{font-style:normal;font-size:max(8px,calc(clamp(9px,1.4vmin,14px)*var(--ts)));
         letter-spacing:2px;color:var(--gold)}
  .lvl{transition:transform .12s ease, filter .12s ease}
  .lvl:hover{transform:translateY(-2px);filter:brightness(1.12)}
  .lvl:active{transform:translateY(0) scale(.97)}
  .lvl:focus-visible{outline:3px solid var(--prism);outline-offset:2px}
  .actions{display:flex;gap:clamp(10px,1.5vmin,16px);justify-content:center;flex-wrap:wrap;
            margin:var(--cardgap) 0 0}
  /* No viewport-height rule here. The stage is aspect-locked at 7:4, so on a phone
     held upright the card gets roughly 180px of height while the viewport reports
     844px. A media query cannot see that box; fitCard measures it and sets the tier. */

  /* A 7:4 stage on an upright phone is about 220px tall, which is too small to
     aim a slingshot in, let alone read a schedule. Rather than shrink the card
     into that, ask for the phone the other way round. Tablets clear the width
     test and are left alone. */
  #rotate{position:fixed;inset:0;z-index:60;display:none;place-items:center;text-align:center;
          padding:28px;background:radial-gradient(circle at 50% 45%,#1d1236,#07040e 78%)}
  #rotate .glyphbox{width:46px;height:76px;margin:0 auto 30px;border-radius:9px;
          border:2px solid rgba(255,209,102,.6);position:relative;
          animation:turn 2.8s ease-in-out infinite}
  /* a screen needs a home button to read as a phone rather than a rectangle */
  #rotate .glyphbox::after{content:'';position:absolute;left:50%;bottom:6px;
          width:15px;height:2px;border-radius:2px;background:rgba(255,209,102,.6);
          transform:translateX(-50%)}
  #rotate h2{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:26px;
             line-height:1.1;margin-bottom:14px}
  #rotate h2 em{font-style:normal;color:var(--gold)}
  #rotate p{color:#cbb7e6;font-size:14.5px;line-height:1.5;max-width:30ch;margin:0 auto}
  @keyframes turn{
    0%,38%{transform:rotate(0deg)}
    62%,100%{transform:rotate(90deg)}
  }
  @media (pointer:coarse) and (orientation:portrait) and (max-width:600px){
    #rotate{display:grid}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:560px){.power{min-width:0}.pname{font-size:12px}.phint{display:none}
    .venue{display:none}
    .plate{padding:6px 10px}}
</style>
</head>
<body>
<div id="frame" aria-hidden="true">

  <!-- Lacquered harlequin. No viewBox, so one user unit is one CSS pixel and the
       diamonds hold their shape at any window size. -->
  <svg id="harlequin">
    <defs>
      <pattern id="harl" width="320" height="216" patternUnits="userSpaceOnUse">
        <rect width="320" height="216" fill="#050209"/>
        <path d="M40 0L80 54L40 108L0 54ZM40 108L80 162L40 216L0 162ZM120 0L160 54L120 108L80 54ZM120 108L160 162L120 216L80 162ZM200 0L240 54L200 108L160 54ZM200 108L240 162L200 216L160 162ZM280 0L320 54L280 108L240 54ZM280 108L320 162L280 216L240 162Z" fill="#090414"/>
        <path d="M0 -54L40 0L0 54L-40 0ZM0 54L40 108L0 162L-40 108ZM0 162L40 216L0 270L-40 216ZM80 -54L120 0L80 54L40 0ZM80 162L120 216L80 270L40 216ZM160 54L200 108L160 162L120 108ZM240 -54L280 0L240 54L200 0ZM240 54L280 108L240 162L200 108ZM240 162L280 216L240 270L200 216ZM320 -54L360 0L320 54L280 0ZM320 54L360 108L320 162L280 108ZM320 162L360 216L320 270L280 216Z" fill="#290a52"/>
        <path d="M80 54L120 108L80 162L40 108ZM160 -54L200 0L160 54L120 0ZM160 162L200 216L160 270L120 216Z" fill="#6b4a0b"/>

        <!-- top facet catches the light, which is what makes them read as raised -->
        <path d="M0 -54L40 0L-40 0ZM0 54L40 108L-40 108ZM0 162L40 216L-40 216ZM80 -54L120 0L40 0ZM80 162L120 216L40 216ZM160 54L200 108L120 108ZM240 -54L280 0L200 0ZM240 54L280 108L200 108ZM240 162L280 216L200 216ZM320 -54L360 0L280 0ZM320 54L360 108L280 108ZM320 162L360 216L280 216Z" fill="#ffffff" fill-opacity=".055"/>
        <path d="M80 54L120 108L40 108ZM160 -54L200 0L120 0ZM160 162L200 216L120 216Z" fill="#ffffff" fill-opacity=".14"/>

        <!-- the border between panes: a dark channel with a gold line riding it -->
        <path d="M0 -54L40 0L0 54L-40 0ZM0 54L40 108L0 162L-40 108ZM0 162L40 216L0 270L-40 216ZM80 -54L120 0L80 54L40 0ZM80 54L120 108L80 162L40 108ZM80 162L120 216L80 270L40 216ZM160 -54L200 0L160 54L120 0ZM160 54L200 108L160 162L120 108ZM160 162L200 216L160 270L120 216ZM240 -54L280 0L240 54L200 0ZM240 54L280 108L240 162L200 108ZM240 162L280 216L240 270L200 216ZM320 -54L360 0L320 54L280 0ZM320 54L360 108L320 162L280 108ZM320 162L360 216L320 270L280 216ZM40 0L80 54L40 108L0 54ZM40 108L80 162L40 216L0 162ZM120 0L160 54L120 108L80 54ZM120 108L160 162L120 216L80 162ZM200 0L240 54L200 108L160 54ZM200 108L240 162L200 216L160 162ZM280 0L320 54L280 108L240 54ZM280 108L320 162L280 216L240 162Z" fill="none"
              stroke="#000000" stroke-opacity=".55" stroke-width="4"/>
        <path d="M0 -54L40 0L0 54L-40 0ZM0 54L40 108L0 162L-40 108ZM0 162L40 216L0 270L-40 216ZM80 -54L120 0L80 54L40 0ZM80 54L120 108L80 162L40 108ZM80 162L120 216L80 270L40 216ZM160 -54L200 0L160 54L120 0ZM160 54L200 108L160 162L120 108ZM160 162L200 216L160 270L120 216ZM240 -54L280 0L240 54L200 0ZM240 54L280 108L240 162L200 108ZM240 162L280 216L240 270L200 216ZM320 -54L360 0L320 54L280 0ZM320 54L360 108L320 162L280 108ZM320 162L360 216L320 270L280 216ZM40 0L80 54L40 108L0 54ZM40 108L80 162L40 216L0 162ZM120 0L160 54L120 108L80 54ZM120 108L160 162L120 216L80 162ZM200 0L240 54L200 108L160 54ZM200 108L240 162L200 216L160 162ZM280 0L320 54L280 108L240 54ZM280 108L320 162L280 216L240 162Z" fill="none"
              stroke="#ffd166" stroke-opacity=".26" stroke-width="1.6"/>

        <!-- inner detail: an inset outline and a centre pip on the lit panes -->
        <path d="M0 -32.4L24 0L0 32.4L-24 0ZM0 75.6L24 108L0 140.4L-24 108ZM0 183.6L24 216L0 248.4L-24 216ZM80 -32.4L104 0L80 32.4L56 0ZM80 183.6L104 216L80 248.4L56 216ZM160 75.6L184 108L160 140.4L136 108ZM240 -32.4L264 0L240 32.4L216 0ZM240 75.6L264 108L240 140.4L216 108ZM240 183.6L264 216L240 248.4L216 216ZM320 -32.4L344 0L320 32.4L296 0ZM320 75.6L344 108L320 140.4L296 108ZM320 183.6L344 216L320 248.4L296 216ZM80 75.6L104 108L80 140.4L56 108ZM160 -32.4L184 0L160 32.4L136 0ZM160 183.6L184 216L160 248.4L136 216Z" fill="none"
              stroke="#ffd166" stroke-opacity=".12" stroke-width="1"/>
        <path d="M0 -7.02L5.2 0L0 7.02L-5.2 0ZM0 100.98L5.2 108L0 115.02L-5.2 108ZM0 208.98L5.2 216L0 223.02L-5.2 216ZM80 -7.02L85.2 0L80 7.02L74.8 0ZM80 208.98L85.2 216L80 223.02L74.8 216ZM160 100.98L165.2 108L160 115.02L154.8 108ZM240 -7.02L245.2 0L240 7.02L234.8 0ZM240 100.98L245.2 108L240 115.02L234.8 108ZM240 208.98L245.2 216L240 223.02L234.8 216ZM320 -7.02L325.2 0L320 7.02L314.8 0ZM320 100.98L325.2 108L320 115.02L314.8 108ZM320 208.98L325.2 216L320 223.02L314.8 216ZM80 100.98L85.2 108L80 115.02L74.8 108ZM160 -7.02L165.2 0L160 7.02L154.8 0ZM160 208.98L165.2 216L160 223.02L154.8 216Z" fill="#ffd166" fill-opacity=".17"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#harl)"/>
  </svg>

  <div id="gloss"></div>
  <div id="glow"></div>
</div>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="row">
      <div class="plate">
        <div class="eyebrow" id="lvlkicker">Level 1<span class="venue"> · West End Field</span></div>
        <div class="title" id="lvlname">Nashville, TN</div>
        <div class="lvlhint" id="lvlhint"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:flex-start">
        <div class="plate">
          <div class="score" id="score">0</div>
          <div class="horns" id="horns"></div>
          <div class="rec" id="rec"></div>
        </div>
        <button class="btn ghost iconbtn" id="mute" title="Mute sound" aria-label="Mute sound">♪</button>
        <button class="btn ghost iconbtn" id="menu" title="Schedule" aria-label="Schedule">☰</button>
        <button class="btn ghost iconbtn" id="full" title="Full screen" aria-label="Full screen">⛶</button>
      </div>
    </div>
    <div class="row" style="align-items:flex-end">
      <div class="plate power">
        <div class="glyph" id="pglyph">✦</div>
        <div>
          <div class="pname" id="pname">Reading the defense…</div>
          <div class="phint" id="phint">Drag the football back to aim</div>
        </div>
      </div>
      <button class="btn" id="retry">Rerun the drive</button>
    </div>
  </div>
  <div class="veil on" id="veil"><div class="card" id="card"></div></div>
</div>

<script>
const {Engine, World, Bodies, Body, Composite, Events, Vector, Sleeping} = Matter;

/* ---------- world + integrator constants (matched to Matter at delta 16.666) ---------- */
const W = 1400, H = 800, GROUND_Y = 726;
/* Impact shake translates the whole scene by up to half the shake amplitude, so
   the background layers are painted past the canvas edge by this much. Without
   it the shifted frame leaves an unpainted strip and the surround flashes
   through at the border. Shake is capped at 17, giving a worst case of 8.5. */
const BLEED = 26;
const ANCHOR = {x: 205, y: 545};

/* ============================================================
   AUDIO — small synth: envelopes, sweeps, filtered noise, chords
   ============================================================ */
const A = {
  ctx:null, master:null, muted:false, noiseBuf:null,
  boot(){
    if (this.ctx) return true;
    try{
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = .5;
      this.master.connect(this.ctx.destination);
      const n = this.ctx.sampleRate * 1.2, buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i=0;i<n;i++) d[i] = Math.random()*2-1;
      this.noiseBuf = buf;
      return true;
    }catch(e){ return false; }
  },
  get t(){ return this.ctx.currentTime; },
  /* single voice with optional pitch glide */
  tone(freq, dur, o={}){
    if (this.muted || !this.boot()) return;
    const t = this.t + (o.delay||0);
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(o.to,1), t + dur);
    if (o.detune) osc.detune.value = o.detune;
    const peak = (o.gain ?? .06);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + (o.attack ?? .008));
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + dur + .02);
  },
  /* filtered noise burst for impacts */
  noise(dur, o={}){
    if (this.muted || !this.boot()) return;
    const t = this.t + (o.delay||0);
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter();
    f.type = o.filter || 'bandpass';
    f.frequency.setValueAtTime(o.freq ?? 1200, t);
    if (o.sweepTo) f.frequency.exponentialRampToValueAtTime(Math.max(o.sweepTo,40), t + dur);
    f.Q.value = o.q ?? 1.2;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(o.gain ?? .07, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + .02);
  },
  chord(freqs, dur, o={}){ freqs.forEach((f,i)=>this.tone(f, dur, {...o, delay:(o.delay||0)+i*(o.spread||0)})); },
  arp(freqs, step, o={}){ freqs.forEach((f,i)=>this.tone(f, o.dur||.16, {...o, delay:i*step})); }
};

/* note lookup inside the current level's mode */
function note(deg, oct=0){
  const t = theme(), m = t.mode;
  const i = ((deg % m.length) + m.length) % m.length;
  const o = Math.floor(deg / m.length) + oct;
  return t.root * Math.pow(2, (m[i] + 12*o) / 12);
}

const SFX = {
  pull(){ A.tone(180, .07, {type:'sine', gain:.02, to:260}); },
  launch(){
    A.tone(note(0), .28, {type:'triangle', gain:.05, to:note(4,1)});
    A.noise(.18, {freq:400, sweepTo:2600, gain:.035, q:.7});
  },
  glass(){
    A.chord([note(4,1), note(6,1), note(9,1)], .22, {type:'triangle', gain:.035, spread:.012});
    A.noise(.3, {freq:5200, q:.8, gain:.05, sweepTo:2400});
  },
  wood(){
    A.tone(note(0,-1), .13, {type:'square', gain:.045, to:note(0,-2)});
    A.noise(.12, {filter:'lowpass', freq:1400, gain:.05});
  },
  stone(){
    A.tone(note(0,-2), .34, {type:'sine', gain:.075, to:note(0,-2)*.6});
    A.noise(.26, {filter:'lowpass', freq:520, gain:.07, sweepTo:160});
  },
  hurt(){ A.tone(note(1+Math.floor(Math.random()*3)), .09, {type:'square', gain:.03}); },
  pop(){
    A.arp([note(2), note(4), note(6), note(9)], .052, {type:'triangle', gain:.055, dur:.2});
    A.noise(.22, {freq:3000, gain:.03, sweepTo:6000});
  },
  land(){ A.noise(.1, {filter:'lowpass', freq:300, gain:.04}); },
  dissolve(){
    A.tone(note(6,1), .34, {type:'sine', gain:.05, to:note(0,-1)});
    A.noise(.4, {freq:2600, sweepTo:260, gain:.045, q:.8});
    A.tone(note(2), .26, {type:'triangle', gain:.03, delay:.1, to:note(0)});
  },
  power:{
    split(){ A.chord([note(0), note(2), note(4)], .3, {type:'triangle', gain:.045, spread:.03}); },
    boom(){ A.tone(note(2,1), .5, {type:'sawtooth', gain:.06, to:note(0,-2)});
            A.noise(.55, {freq:3000, sweepTo:120, gain:.08, q:.6}); },
    dash(){ A.tone(note(0), .22, {type:'sawtooth', gain:.05, to:note(2,2)});
            A.noise(.2, {freq:900, sweepTo:5000, gain:.03}); },
    anvil(){ A.tone(note(0,-2), .4, {type:'square', gain:.07, to:note(0,-3)});
             A.noise(.3, {filter:'lowpass', freq:400, gain:.06}); },
    bounce(){ A.tone(note(0), .26, {type:'sine', gain:.06, to:note(4,1)});
              A.tone(note(4,1), .18, {type:'sine', gain:.04, to:note(0), delay:.26}); }
  },
  whistle(){
    A.noise(.15, {filter:'bandpass', freq:2500, q:12, gain:.05, sweepTo:3200});
    A.tone(2450, .14, {type:'sine', gain:.022, to:2750});
  },
  cowbell(){
    A.tone(540, .17, {type:'square', gain:.040, to:412});
    A.tone(806, .13, {type:'square', gain:.026, to:640, delay:.004});
    A.noise(.09, {filter:'bandpass', freq:2300, q:6, gain:.018});
  },
  crowdSwell(){ A.noise(1.0, {filter:'lowpass', freq:620, gain:.030, sweepTo:250, q:.5}); },
  gust(){ A.noise(1.5, {filter:'bandpass', freq:340, sweepTo:2200, gain:.035, q:.8}); },
  chimes(){ [0,2,4,7].forEach((d,i)=>A.tone(note(d,1), .95, {type:'sine', gain:.05, delay:i*.33})); },
  fanfare(){
    /* eight notes written for this game; no real fight song is quoted */
    [0,2,4,7,4,7,9,11].forEach((d,i)=>{
      A.tone(note(d,1), .30, {type:'sawtooth', gain:.040, delay:i*.155});
      A.tone(note(d,1)*1.004, .30, {type:'triangle', gain:.026, delay:i*.155});
    });
    A.chord([note(0,1), note(4,1), note(7,1)], 1.5, {type:'sine', gain:.038, delay:1.30, spread:.02});
  },
  win(){ A.arp([note(0), note(2), note(4), note(7,1)], .11, {type:'triangle', gain:.07, dur:.42});
         A.chord([note(0,1), note(4,1)], .8, {type:'sine', gain:.035, delay:.46}); },
  lose(){ A.arp([note(4), note(2), note(0)], .15, {type:'triangle', gain:.05, dur:.34});
          A.tone(note(0,-1), .7, {type:'sine', gain:.04, delay:.42}); }
};

/* the host storage shim is not present in a plain browser, so localStorage is the
   real persistence path for a season record that has to survive a reload */
async function loadProgress(){
  let raw = null;
  try{ if (window.storage){ const r = await window.storage.get(SAVE_KEY); raw = r && r.value; } }catch(e){}
  if (raw == null){ try{ raw = localStorage.getItem(SAVE_KEY); }catch(e){} }
  if (raw == null){
    for (const k of OLD_SAVE_KEYS){
      try{ const v = localStorage.getItem(k); if (v){ raw = v; break; } }catch(e){}
    }
  }
  if (raw){ try{ const d = JSON.parse(raw); best = d.best || {}; season = d.season || {}; }catch(e){} }
}
async function saveProgress(){
  const payload = JSON.stringify({best, season});
  try{ if (window.storage) await window.storage.set(SAVE_KEY, payload); }catch(e){}
  try{ localStorage.setItem(SAVE_KEY, payload); }catch(e){}
}

/* ---------- build ---------- */
function makeEngine(){
  /* Matter injects a little energy at every resting contact, so a tall stack slides
     sideways at a constant rate and eventually falls over on its own with nobody
     touching it. Raising solver iterations hides it but makes every tower resist
     demolition. Sleeping is the real fix: settled bodies stop integrating entirely
     and wake the moment something hits them. */
  engine = Engine.create({ enableSleeping: true });
  engine.gravity.y = 1.0;
  world = engine.world;
  const ground = Bodies.rectangle(W/2, GROUND_Y + 60, W*2, 120, {isStatic:true, friction:.9});
  ground.plugin = {kind:'ground'};
  Composite.add(world, ground);
  Events.on(engine, 'collisionStart', onHit);
  Events.on(engine, 'collisionActive', onGrind);
}

function loadLevel(i){
  level = i;
  const L = LEVELS[i];
  blocks = []; grumps = []; flock = []; particles = []; motes = []; trail = []; fauna = [];
  held = null; activeShot = null; dragging = false; score = 0; awaitingSettle = false;
  winHold = 0;
  shotsLeft = L.shots;
  if (engine){
    Events.off(engine, 'collisionStart', onHit);
    Events.off(engine, 'collisionActive', onGrind);
    Engine.clear(engine);
  }
  makeEngine();
  buildScenery();

  L.blocks.forEach(b=>{
    const m = MATS[b.mat];
    const body = Bodies.rectangle(b.x, b.y + b.h/2, b.w, b.h,
      {density:m.density, friction:m.friction, restitution:m.restitution});
    body.plugin = {kind:'block', mat:b.mat, hp:m.hp, w:b.w, h:b.h,
                   ox:b.x, oy:b.y + b.h/2};
    blocks.push(body); Composite.add(world, body);
  });
  /* Flag blocks that carry mass. A glass member holding a stone crown is the puzzle:
     the player has to be able to see it, so the renderer marks these with stress lines. */
  L.blocks.forEach((b, i)=>{
    const top = b.y, left = b.x - b.w/2, right = b.x + b.w/2;
    let load = 0;
    L.blocks.forEach((o, j)=>{
      if (i === j) return;
      const oBottom = o.y + o.h;
      if (Math.abs(oBottom - top) > 10) return;                    // not resting on us
      if (o.x + o.w/2 <= left + 2 || o.x - o.w/2 >= right - 2) return;  // no overlap
      load++;
    });
    blocks[i].plugin.bearing = load > 0;
  });
  L.grumps.forEach((g, gi)=>{
    const body = Bodies.circle(g.x, g.y, 26,
      {density:.0021, friction:.62, frictionStatic:1.4, restitution:.12});
    /* grumps perch rather than roll: no spin means they hold a ledge until struck */
    Body.setInertia(body, Infinity);
    body.plugin = {kind:'grump', hp:2.4, hurt:0, variant:gi};
    grumps.push(body); Composite.add(world, body);
  });

  const t = theme();
  document.getElementById('lvlkicker').innerHTML = `Level ${i+1}<span class="venue"> · ${L.venue}</span>`;
  document.getElementById('lvlkicker').style.color = t.accent;
  document.getElementById('lvlname').textContent = L.name;
  const hintEl = document.getElementById('lvlhint');
  hintEl.textContent = L.hint || '';
  hintEl.classList.add('show');
  clearTimeout(hintEl._t);
  hintEl._t = setTimeout(()=>hintEl.classList.remove('show'), 6000);
  document.documentElement.style.setProperty('--gold', t.accent);
  starField = Array.from({length:t.stars},()=>({
    x:Math.random()*W, y:Math.random()*460, r:Math.random()*2+.8, a:Math.random()*.8+.2,
    tw:Math.random()*6.28
  }));
  skyCache = null;
  updateHUD();
  nextBall();
  phase = 'play';
  gust = 0; gustNext = 7;
  SFX.whistle();
  if (themeKey() === 'tuscaloosa') setTimeout(()=>SFX.chimes(), 420);
}

function nextBall(){
  if (shotsLeft <= 0){ held = null; return; }
  /* never deal the same power twice running: a level shouldn't be lost to the draw */
  const pool = POWERS.filter(p => p !== currentPower);
  currentPower = pool[Math.floor(Math.random()*pool.length)];
  powerUsed = false;
  held = Bodies.circle(ANCHOR.x, ANCHOR.y, 22, {density:.0062, friction:.4, restitution:.4});
  /* a ball that dozes on the tee stops responding to the drag, so it never sleeps */
  held.sleepThreshold = Infinity;
  /* set static through the API, not the constructor: Matter only records the
     original mass/inertia on the setter, and without them the body launches as NaN */
  Body.setStatic(held, true);
  held.plugin = {kind:'uni'};
  Composite.add(world, held);
  flock.push(held);
  document.getElementById('pglyph').textContent = currentPower.glyph;
  document.getElementById('pname').textContent = currentPower.name;
  document.getElementById('phint').textContent = 'Drag back to aim · tap in flight to use';
}

/* ---------- collisions + damage (tuned and regression-tested) ---------- */
function impactEnergy(a, b){
  const rel = Vector.magnitude(Vector.sub(a.velocity, b.velocity));
  const ma = a.isStatic ? 1000 : a.mass, mb = b.isStatic ? 1000 : b.mass;
  return rel * (ma*mb)/(ma+mb);
}
function onHit(evt){
  for (const pair of evt.pairs){
    const {bodyA, bodyB} = pair;
    let e = impactEnergy(bodyA, bodyB);
    if (bodyA.isStatic || bodyB.isStatic) e *= .40;
    if (e < 4) continue;
    if (e > 34) shake = Math.min(17, Math.max(shake, e*.22));
    if (e > 26 && (bodyA.plugin?.kind === 'uni' || bodyB.plugin?.kind === 'uni')) SFX.land();
    if (e > 14 && themeKey() === 'mstate' && performance.now() - lastBell > 150){
      lastBell = performance.now(); SFX.cowbell();
    }
    [bodyA, bodyB].forEach(b=>{
      const p = b.plugin; if (!p) return;
      if (p.kind === 'block'){
        p.hp -= e;
        if (p.hp <= 0) shatter(b);
      } else if (p.kind === 'grump'){
        const dmg = Math.min((e - 5) / 8, 3);
        if (dmg > 0) hurtGrump(b, dmg);
      }
    });
  }
}
function onGrind(evt){
  for (const pair of evt.pairs){
    const {bodyA, bodyB} = pair;
    [[bodyA,bodyB],[bodyB,bodyA]].forEach(([b, other])=>{
      if (!b.plugin || b.plugin.kind !== 'grump' || b.plugin.hp <= 0) return;
      /* a heavy pair at rest still reports energy from micro-jitter, which bled
         hp off defenders that nothing had touched; gate on real relative speed */
      const rel = Vector.magnitude(Vector.sub(b.velocity, other.velocity));
      const e = impactEnergy(b, other);
      if (rel > 1.2 && e > 5){ hurtGrump(b, (e - 5) / 45); return; }
      if (rel > 1.2) return;
      /* Crushing is meant for debris that has come down on a defender, not for the
         structure as it was built. Several towers seat a defender between the two
         columns of the tier above, and without this displacement test that resting
         contact quietly killed it over about ten seconds. */
      const om = other.isStatic ? 0 : other.mass;
      if (om <= 3.5 || other.position.y >= b.position.y - 6) return;
      const op = other.plugin;
      const shifted = !op || op.ox === undefined
        ? true
        : Math.hypot(other.position.x - op.ox, other.position.y - op.oy) > 22;
      if (shifted) hurtGrump(b, om * .0006);
    });
  }
}
function hurtGrump(b, dmg){
  const p = b.plugin;
  if (p.hp <= 0) return;
  p.hp -= dmg;
  if (dmg > .25){
    p.hurt = performance.now();
    if (performance.now() - (p.lastSound||0) > 130){ p.lastSound = performance.now(); SFX.hurt(); }
  }
  if (p.hp <= 0) popGrump(b);
}
function shatter(b, fell){
  const p = b.plugin, t = theme();
  burst(b.position.x, b.position.y, p.rubble ? 8 : 14, t.mats[p.mat].line);
  if (p.mat === 'glass') SFX.glass(); else if (p.mat === 'stone') SFX.stone(); else SFX.wood();
  /* a piece that fell to the ground crumbles away entirely: it must not leave a
     platform for a grump to survive on */
  if (!fell && p.mat === 'stone' && !p.rubble && Math.max(p.w, p.h) > 60) splitStone(b);
  Composite.remove(world, b);
  blocks = blocks.filter(x=>x!==b);
  wakeAll();
  score += p.rubble ? 40 : 120; updateHUD();
}

/* a stone column doesn't vanish, it cracks in half and the halves keep falling */
function splitStone(b){
  const p = b.plugin, horiz = p.w > p.h;
  const nw = horiz ? p.w/2 - 4 : p.w;
  const nh = horiz ? p.h : p.h/2 - 4;
  for (const side of [-1, 1]){
    const off = Vector.rotate({x: horiz ? side*p.w/4 : 0, y: horiz ? 0 : side*p.h/4}, b.angle);
    const nb = Bodies.rectangle(b.position.x + off.x, b.position.y + off.y, nw, nh,
      {density: MATS.stone.density*.92, friction:.72, restitution:.02, angle:b.angle});
    nb.plugin = {kind:'block', mat:'stone', rubble:true, hp:34, w:nw, h:nh,
                 ox:b.position.x + off.x, oy:b.position.y + off.y};
    Body.setVelocity(nb, {x: b.velocity.x*.85 + side*1.1, y: b.velocity.y*.85 - .7});
    Body.setAngularVelocity(nb, b.angularVelocity + side*.04);
    blocks.push(nb); Composite.add(world, nb);
  }
  wakeAll();
  shake = Math.max(shake, 6);
  particles.push(...Array.from({length:6},()=>({
    x:b.position.x, y:b.position.y, vx:(Math.random()-.5)*6, vy:-Math.random()*5,
    life:.9, size:2+Math.random()*3, spin:0, color:theme().mats.stone.line})));
}
function popGrump(b){
  burst(b.position.x, b.position.y, 26, '', true);
  SFX.pop();
  SFX.crowdSwell();
  shake = Math.max(shake, 12);
  floatText(b.position.x, b.position.y - 18, 'TOUCHDOWN', '#FDD023');
  Composite.remove(world, b);
  grumps = grumps.filter(x=>x!==b);
  wakeAll();
  score += 1200; updateHUD();
}
/* grumps only exist up high; touching the ground ends them */
function dissolveGrump(b){
  b.plugin.hp = 0;
  const y = Math.min(b.position.y, GROUND_Y - 18);
  for (let i=0;i<(reduced?8:22);i++)
    particles.push({x:b.position.x + (Math.random()-.5)*40, y:y + (Math.random()-.5)*16,
      vx:(Math.random()-.5)*4, vy:-Math.random()*4.5, life:1,
      size:2+Math.random()*4, spin:0,
      color:`hsl(${180+Math.random()*90}, 80%, ${58+Math.random()*20}%)`});
  SFX.dissolve();
  Composite.remove(world, b);
  grumps = grumps.filter(x=>x!==b);
  wakeAll();
  score += 1200; updateHUD();
}

/* Matter does not wake a sleeping body when the thing underneath it is removed, so
   a tower whose support had just been shattered hung in mid-air. Anything that
   changes the structure has to wake the structure. */
function wakeAll(){
  for (const b of blocks) Sleeping.set(b, false);
  for (const g of grumps) Sleeping.set(g, false);
  for (const u of flock) Sleeping.set(u, false);
}

function burst(x, y, n, color, rainbow=false){
  const count = reduced ? Math.ceil(n/3) : n;
  for (let i=0;i<count;i++)
    particles.push({x, y, vx:(Math.random()-.5)*11, vy:(Math.random()-.5)*11-2,
      life:1, size:2+Math.random()*5, spin:Math.random()*6.28,
      color: rainbow ? `hsl(${Math.random()*360}, 92%, 70%)` : color});
}

/* ---------- powers ---------- */
function firePower(){
  if (!activeShot || powerUsed) return;
  powerUsed = true;
  const b = activeShot, v = b.velocity, p = b.position;
  SFX.power[currentPower.id]();
  switch(currentPower.id){
    case 'split':
      for (const ang of [-0.32, 0.32]){
        const nb = Bodies.circle(p.x, p.y, 17, {density:.0055, friction:.4, restitution:.4});
        nb.sleepThreshold = Infinity;
        nb.plugin = {kind:'uni'};
        Composite.add(world, nb); flock.push(nb);
        Body.setVelocity(nb, {x: v.x*Math.cos(ang) - v.y*Math.sin(ang),
                              y: v.x*Math.sin(ang) + v.y*Math.cos(ang)});
      }
      break;
    case 'boom':
      burst(p.x, p.y, 44, '', true);
      wakeAll();
      [...blocks, ...grumps].forEach(o=>{
        const d = Vector.sub(o.position, p), dist = Vector.magnitude(d);
        if (dist < 230){
          Sleeping.set(o, false);
          const f = (1 - dist/230) * 0.42;
          Body.applyForce(o, o.position, {x:(d.x/dist)*f*o.mass, y:(d.y/dist)*f*o.mass - .08*o.mass});
        }
      });
      Composite.remove(world, b);
      flock = flock.filter(x=>x!==b);
      activeShot = null;
      break;
    case 'dash':  Body.setVelocity(b, {x:v.x*2.3, y:v.y*2.3 - 1.5}); break;
    case 'anvil': Body.setMass(b, b.mass*7); Body.setVelocity(b, {x:v.x*.5, y:26}); break;
    case 'bounce':b.restitution = .95;
                  Body.setVelocity(b, {x:v.x*1.15, y:-Math.abs(v.y)*.85 - 9}); break;
  }
  document.getElementById('phint').textContent = 'Play spent';
}

/* ---------- input ---------- */
function toWorld(e){
  const r = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return {x:(t.clientX - r.left)/r.width * W, y:(t.clientY - r.top)/r.height * H};
}
function down(e){
  if (phase !== 'play') return;
  A.boot();
  const p = toWorld(e);
  if (held && Vector.magnitude(Vector.sub(p, held.position)) < 90){
    dragging = true; Sleeping.set(held, false); SFX.pull(); e.preventDefault();
  } else if (activeShot && !powerUsed){ firePower(); e.preventDefault(); }
}
function move(e){
  if (!dragging || !held) return;
  /* If the button was released off-window, no mouseup ever reached the page. The
     first move back inside reports no buttons down, which is where we catch it. */
  if (e.buttons === 0){ up(); return; }
  const p = toWorld(e);
  let d = Vector.sub(p, ANCHOR);
  if (Vector.magnitude(d) > MAX_PULL) d = Vector.mult(Vector.normalise(d), MAX_PULL);
  if (d.x > 0) d.x *= .25;
  Sleeping.set(held, false);
  Body.setPosition(held, Vector.add(ANCHOR, d));
  e.preventDefault();
}
function up(){
  if (!dragging || !held) return;
  dragging = false;
  const pull = Vector.sub(ANCHOR, held.position);
  if (Vector.magnitude(pull) < 14){ Body.setPosition(held, ANCHOR); return; }
  Body.setStatic(held, false);
  Sleeping.set(held, false);
  Body.setVelocity(held, Vector.mult(pull, LAUNCH));
  activeShot = held; held = null; shotsLeft--;
  settleTimer = 0; trail = []; awaitingSettle = true;
  SFX.launch();
  document.getElementById('phint').textContent = currentPower.hint;
  updateHUD();
}
/* The drag starts on the canvas but is tracked on the window. Once a pull is in
   progress the cursor is free to cross the border, or leave the page entirely, and
   the slingshot keeps following it. toWorld() maps any screen point into game space,
   and MAX_PULL clamps whatever comes back, so out-of-bounds coordinates are safe. */
canvas.addEventListener('mousedown', down);
window.addEventListener('mousemove', move);
window.addEventListener('mouseup', up);
canvas.addEventListener('touchstart', down, {passive:false});
window.addEventListener('touchmove', move, {passive:false});
window.addEventListener('touchend', up);
window.addEventListener('touchcancel', up);
/* A drag that ends off-window never fires mouseup on the page. Releasing the button
   outside and coming back would otherwise leave the bird glued to the cursor. */
window.addEventListener('blur', up);
window.addEventListener('keydown', e=>{
  if (e.code === 'Space'){
    /* Space is the fire button during a shot, but it is also how a keyboard
       player activates a focused button. Swallowing it everywhere left the
       cards reachable by Tab and impossible to press with anything but Enter. */
    const onControl = e.target instanceof Element &&
                      e.target.closest('button, a, [role="button"]');
    if (phase !== 'play' && onControl) return;
    e.preventDefault(); firePower();
  }
  if (e.code === 'KeyR' && phase === 'play') loadLevel(level);
});

/* ---------- turn flow ---------- */
function allAsleep(){
  return ![...flock, ...blocks, ...grumps].some(b=>
    !b.isStatic && (Vector.magnitude(b.velocity) > 0.42 || Math.abs(b.angularVelocity) > 0.05));
}
function tickTurn(dt){
  if (phase !== 'play') return;

  /* Anything that has fallen and reached the ground crumbles away. Without this,
     debris piles into a platform and a grump can ride it out above the kill line. */
  blocks.slice().forEach(b=>{
    const p = b.plugin;
    if (!p || p.doomed) return;
    const moved = Math.hypot(b.position.x - p.ox, b.position.y - p.oy);
    if (moved < 45) return;                       // still where it was built
    if (b.bounds.max.y < GROUND_Y - 4) return;    // not down yet
    p.doomed = true;
    shatter(b, true);
  });

  /* A shot that clears the board should be watched, not cut off. Hold the level open
     so the collapse and the last pop actually play before the card appears. */
  if (grumps.length === 0){
    winHold += dt;
    if (winHold > WIN_HOLD_MS) finish(true);
    return;
  }

  if (awaitingSettle){
    if (allAsleep()) settleTimer += dt; else settleTimer = 0;
    if (settleTimer > 900){
      flock.forEach(u=>Composite.remove(world, u));
      flock = []; activeShot = null; settleTimer = 0; awaitingSettle = false;
      if (shotsLeft > 0) nextBall(); else finish(false);
    }
  }
  grumps.slice().forEach(g=>{
    if (g.plugin.hp > 0 && (g.position.y > GROUND_Y - 40 || g.position.y > H)) dissolveGrump(g);
  });
  flock.forEach(u=>{
    if (u.position.y > H + 300 || u.position.x > W + 400 || u.position.x < -400){
      Composite.remove(world, u);
      flock = flock.filter(x=>x!==u);
      if (u === activeShot) activeShot = null;
    }
  });
}

function finish(won){
  if (phase !== 'play') return;
  phase = 'over';
  const bonus = won ? shotsLeft * 900 : 0;
  const final = score + bonus;
  /* stars scale to the level's budget: short puzzles must still be able to earn three */
  const budget = LEVELS[level].shots;
  const stars = !won ? 0
    : shotsLeft >= Math.ceil(budget/2) ? 3
    : shotsLeft >= 1 ? 2 : 1;
  /* two stars or better is a win. Clearing the board on your last football is a
     survival, and it goes in the book as a loss. */
  const isWin = stars >= 2;
  const finale = level === LEVELS.length - 1;
  const L = LEVELS[level];

  if (won){ totalScore += final; best[level] = Math.max(best[level]||0, stars); }
  if (isWin) season[level] = 'W';
  else if (season[level] !== 'W') season[level] = 'L';
  saveProgress();

  const wins = roadWins(), losses = roadLoss();
  const champ = finale && isWin && wins >= TITLE_WINS;
  if (champ) SFX.fanfare(); else if (isWin) SFX.win(); else SFX.lose();
  if (champ){ shake = Math.max(shake, 10); for (let i=0;i<9;i++) setTimeout(()=>SFX.pop(), i*230); }

  const t = theme(), card = document.getElementById('card');
  /* Level names carry a state suffix ("Starkville, MS"), which must not leak into
     the headline: splitting the whole string on spaces would emphasise the
     abbreviation and turn the one-star card into "Survived MS". */
  const city = L.name.split(',')[0].trim();
  const words = city.split(' ');
  const recLine = `Season record <b style="color:${t.accent}">${wins}&ndash;${losses}</b>`;
  const nextBtn = level < LEVELS.length-1 ? 'Next stadium' : 'Back to the schedule';

  if (champ){
    card.innerHTML = `
      <div class="eyebrow" style="color:var(--gold)">Confetti on the Levee</div>
      <h1>National <em>Champions</em></h1>
      <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
      <p>You finished the road ${wins}&ndash;${losses} and took the rematch.
         ${final.toLocaleString()} points on the night.</p>
      <div class="actions">
        <button class="btn" id="pick">See the season</button>
        <button class="btn ghost" id="again">Play it again</button>
      </div>`;
    document.getElementById('again').onclick = ()=>{ hideVeil(); loadLevel(level); };
    document.getElementById('pick').onclick = showMenu;
  } else if (finale && isWin){
    card.innerHTML = `
      <div class="eyebrow" style="color:${t.accent}">Rematch won</div>
      <h1>The wall <em>came down</em></h1>
      <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
      <p>But you came in ${wins}&ndash;${losses}. The title needed ${TITLE_WINS} road wins.
         Go back and turn some losses into wins.</p>
      <div class="actions">
        <button class="btn" id="pick">See the season</button>
        <button class="btn ghost" id="again">Play it again</button>
      </div>`;
    document.getElementById('again').onclick = ()=>{ hideVeil(); loadLevel(level); };
    document.getElementById('pick').onclick = showMenu;
  } else if (isWin){
    card.innerHTML = `
      <div class="eyebrow" style="color:${t.accent}">Win at ${L.venue}</div>
      <h1>${words.slice(0,-1).join(' ')} <em>${words.slice(-1)}</em></h1>
      <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
      <p>${final.toLocaleString()} points, ${shotsLeft} football${shotsLeft===1?'':'s'} unused. ${recLine}.</p>
      <div class="actions">
        <button class="btn" id="next">${nextBtn}</button>
        <button class="btn ghost" id="again">Rerun it</button>
      </div>`;
    document.getElementById('next').onclick = ()=>{
      hideVeil();
      if (level < LEVELS.length-1) loadLevel(level+1); else showMenu();
    };
    document.getElementById('again').onclick = ()=>{ hideVeil(); loadLevel(level); };
  } else if (won){
    card.innerHTML = `
      <div class="eyebrow" style="color:${t.accent}">One star &mdash; that goes down as a loss</div>
      <h1>Survived <em>${city}</em></h1>
      <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
      <p>You cleared the board on your last football. Two stars or better wins the game.
         ${recLine}.</p>
      <div class="actions">
        <button class="btn" id="again">Rerun the drive</button>
        <button class="btn ghost" id="next">${nextBtn}</button>
      </div>`;
    document.getElementById('next').onclick = ()=>{
      hideVeil();
      if (level < LEVELS.length-1) loadLevel(level+1); else showMenu();
    };
    document.getElementById('again').onclick = ()=>{ hideVeil(); loadLevel(level); };
  } else {
    card.innerHTML = `
      <div class="eyebrow" style="color:${t.accent}">Turnover on downs</div>
      <h1>The defense <em>held</em></h1>
      <p>${grumps.length} still standing. Aim lower and let the structure do the work.
         ${recLine}.</p>
      <div class="actions">
        <button class="btn" id="again">Run it back</button>
        <button class="btn ghost" id="pick">Schedule</button>
      </div>`;
    document.getElementById('again').onclick = ()=>{ hideVeil(); loadLevel(level); };
    document.getElementById('pick').onclick = showMenu;
  }
  showVeil();
  fitCard();
}

/* ---------- menus ---------- */
/* Card content ranges from a short win card to the full schedule, and the stage is
   aspect-locked, so the room available swings from ~350px to ~780px. A fixed rhythm
   either cramps the big screens or pushes the button off the small ones, so the gap
   is measured: lay the card out flat, see what is left over, and share it out.

   The share is not equal. A title and its subtitle read as one object and want to
   stay close, while the schedule grid and the kickoff button need real air above
   them to register as separate moves. Each row carries a weight, and the leftover
   room is divided in those proportions. */
const GAP_WEIGHT = [
  ['h1.gametitle', 0.34],  /* game title to its subtitle: one unit, keep it tight */
  ['.subtitle',    1.50],  /* end of the masthead, start of the body copy */
  ['.eyebrow',     0.34],  /* result kicker sits directly on the headline */
  ['h1',           0.90],
  ['.stars',       1.25],
  ['.howto',       1.15],  /* the one rule, so give it room on both sides */
  ['.plays',       1.60],
  ['.recline',     1.40],
  ['.grid',        1.50],  /* schedule to button */
];
const GAP_MIN = 4;      /* absolute floor: below this the rows read as one block */
const GAP_WANT = 20;    /* below this, shed a tier instead of squeezing further */
const GAP_MAX = 40;
const TIERS = ['', '1', '2', '3', '4'];
function gapWeight(el){
  for (const [sel,w] of GAP_WEIGHT) if (el.matches(sel)) return w;
  return 1;
}
/* Step down the tiers until the spacing comes out comfortable. Each tier shrinks
   the type a little and, past the second, starts hiding the rows that carry the
   least: the chip row, then the lede, then the how-to box and the team names.
   The last tier is accepted whatever it measures, and the card scrolls only if
   even that does not fit. */
function fitCard(){
  const card = document.getElementById('card'), veil = document.getElementById('veil');
  if (!card || !veil || !card.children.length) return;
  const cs = getComputedStyle(veil);
  const avail = veil.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const prevMax = card.style.maxHeight, prevOv = card.style.overflowY;
  card.style.maxHeight = 'none'; card.style.overflowY = 'visible';
  card.style.setProperty('--cardgap', '0px');
  [...card.children].forEach(el=>el.style.marginBottom = '0px');
  /* the card's own max-height is calc(100% - 8px), so the real ceiling sits below
     the room measured here */
  const ceiling = avail - 12;

  let best = null;
  for (const tier of TIERS){
    if (tier) card.dataset.tier = tier; else delete card.dataset.tier;
    const bare = card.getBoundingClientRect().height;
    /* the final row needs no trailing gap, so it is dropped from the split */
    const rows = [...card.children].filter(el=>getComputedStyle(el).display !== 'none');
    rows.pop();
    const weight = rows.reduce((s,el)=>s + gapWeight(el), 0) || 1;
    const unit = (ceiling - bare) / weight;
    best = {tier, rows, weight, unit};
    if (unit >= GAP_WANT) break;
  }
  if (best.tier) card.dataset.tier = best.tier; else delete card.dataset.tier;
  card.style.maxHeight = prevMax; card.style.overflowY = prevOv;
  /* gaps are floored to whole pixels so the margins cannot accumulate past the ceiling */
  const unit = Math.max(GAP_MIN, Math.min(GAP_MAX, best.unit));
  best.rows.forEach(el=>el.style.marginBottom = Math.floor(unit * gapWeight(el)) + 'px');
}

        /* the tall one gets twin spires */
        if (p.h > 250){
          ctx.beginPath();
          ctx.moveTo(p.x+3, top); ctx.lineTo(p.x+7, top-42); ctx.lineTo(p.x+11, top);
          ctx.moveTo(p.x+p.w-11, top); ctx.lineTo(p.x+p.w-7, top-42); ctx.lineTo(p.x+p.w-3, top);
          ctx.fill();
