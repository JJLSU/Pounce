function drawSky(){
  const t = theme();
  const g = ctx.createLinearGradient(0,0,0,GROUND_Y);
  t.sky.forEach(([s,c])=>g.addColorStop(s,c));
  ctx.fillStyle = g; ctx.fillRect(-BLEED,-BLEED,W+BLEED*2,GROUND_Y+BLEED);

  const now = performance.now()/1000;
  ctx.fillStyle = '#fff';
  starField.forEach(s=>{
    ctx.globalAlpha = s.a * (.55 + .45*Math.sin(now*1.4 + s.tw));
    ctx.fillRect(s.x, s.y, s.r, s.r);
  });
  ctx.globalAlpha = 1;

  if (t.sun){
    /* slow-turning rays behind the disc */
    if (!reduced){
      ctx.save();
      ctx.translate(t.sun.x, t.sun.y);
      ctx.rotate(now*.03);
      /* rays fade out along their length so they read as light, not as blades */
      const rg = ctx.createRadialGradient(0,0,10, 0,0,260);
      rg.addColorStop(0, 'rgba(255,246,220,.10)');
      rg.addColorStop(.45,'rgba(255,240,205,.05)');
      rg.addColorStop(1, 'rgba(255,235,190,0)');
      ctx.fillStyle = rg;
      for (let i=0;i<10;i++){
        ctx.rotate(Math.PI/5);
        ctx.beginPath();
        ctx.moveTo(0,0); ctx.lineTo(255,-13); ctx.lineTo(255,13); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
    ctx.fillStyle = t.sun.c;
    ctx.globalAlpha = .18;
    ctx.beginPath(); ctx.arc(t.sun.x, t.sun.y, 72, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = .34;
    ctx.beginPath(); ctx.arc(t.sun.x, t.sun.y, 56, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(t.sun.x, t.sun.y, 44, 0, Math.PI*2); ctx.fill();
  }
  /* horizon glow band picks up the warm foot of the sky gradient */
  const hz = ctx.createLinearGradient(0, 470, 0, 640);
  hz.addColorStop(0, 'rgba(255,255,255,0)');
  hz.addColorStop(1, 'rgba(255,240,210,.10)');
  ctx.fillStyle = hz; ctx.fillRect(0, 470, W, 170);
  /* third, farthest ridge for depth */
  hill(mix(t.hills[0], '#8f7fb8', .35), 600, 170);
  drawProps();
  drawCrowdFlashes();
  drawFloodlights();
  hill(t.hills[0], 640, 120);
  hill(t.hills[1], 690, 78);
  drawPropsFore();
  const haze = ctx.createLinearGradient(0, 520, 0, GROUND_Y);
  haze.addColorStop(0, 'rgba(0,0,0,0)');
  haze.addColorStop(1, 'rgba(0,0,0,.28)');
  ctx.fillStyle = haze; ctx.fillRect(0, 520, W, GROUND_Y-520);
}

function drawVignette(){
  const g = ctx.createRadialGradient(W/2, H*.46, H*.34, W/2, H*.46, H*.95);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.42)');
  ctx.fillStyle = g; ctx.fillRect(-BLEED,-BLEED,W+BLEED*2,H+BLEED*2);
}
function hill(color, baseY, amp){
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(0, baseY);
  for (let x=0;x<=W;x+=40) ctx.lineTo(x, baseY - Math.sin(x/230 + amp)*amp*.55 - amp*.35);
  ctx.lineTo(W, GROUND_Y+10); ctx.lineTo(0, GROUND_Y+10); ctx.closePath(); ctx.fill();
}

/* Props that belong in front of the hills. Drawn after them so they are not buried. */
/* Props that belong in front of the hills. Drawn after them so they are not buried. */
function drawPropsFore(){
  const t = theme(), now = performance.now()/1000;
  ctx.save();
  switch(t.props){

    case 'horsefarm': {
      /* four-board white fence running the width of the field */
      ctx.strokeStyle = 'rgba(238,240,244,.88)'; ctx.lineWidth = 4;
      for (let k=0;k<4;k++){
        const y = 664 + k*15;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(226,230,238,.92)'; ctx.lineWidth = 7;
      props.filter(p=>p.kind==='post').forEach(p=>{
        ctx.beginPath(); ctx.moveTo(p.x, 656); ctx.lineTo(p.x, 726); ctx.stroke();
      });
      break;
    }

    case 'hedgerow': {
      /* the hedge: a clipped green wall, the one read this level needs */
      const hg = ctx.createLinearGradient(0, 640, 0, 726);
      hg.addColorStop(0,'#2f5c33');
      hg.addColorStop(.5,'#1e4224');
      hg.addColorStop(1,'#0e2314');
      ctx.fillStyle = hg;
      ctx.fillRect(0, 652, W, 74);
      ctx.fillStyle = 'rgba(90,150,86,.5)';
      props.filter(p=>p.kind==='hedge').forEach(p=>{
        ctx.beginPath(); ctx.arc(p.x, 654, 13*p.s, Math.PI, 0); ctx.fill();
      });
      ctx.strokeStyle = 'rgba(140,200,130,.20)'; ctx.lineWidth = 1.4;
      for (let i=0;i<70;i++){
        const x = i*20 + (i%3)*4;
        ctx.beginPath(); ctx.moveTo(x, 662); ctx.lineTo(x+5, 690); ctx.stroke();
      }
      break;
    }

    case 'swamp': {
      /* cypress knees breaking the surface */
      ctx.fillStyle = 'rgba(10,26,18,.95)';
      props.filter(p=>p.kind==='knee').forEach(p=>{
        const h = 26*p.s;
        ctx.beginPath();
        ctx.moveTo(p.x-6*p.s, 726); ctx.quadraticCurveTo(p.x-2*p.s, 726-h, p.x+2*p.s, 726-h);
        ctx.quadraticCurveTo(p.x+6*p.s, 726-h*.6, p.x+7*p.s, 726);
        ctx.closePath(); ctx.fill();
      });
      break;
    }

    case 'prairie': {
      /* wheat rows bending in the wind */
      props.filter(p=>p.kind==='wheatrow').forEach((p,i)=>{
        ctx.strokeStyle = `rgba(226,190,104,${(.16+i*.03).toFixed(3)})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let x=0;x<=W;x+=24){
          const y = p.y + Math.sin(x/90 + now*1.6 + p.p)*4;
          if (!x) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.stroke();
      });
      break;
    }

    case 'levee': {
      /* end line and a low glow off the turf */
      const gl = ctx.createLinearGradient(0, 690, 0, 726);
      gl.addColorStop(0,'rgba(253,208,35,0)');
      gl.addColorStop(1,'rgba(253,208,35,.10)');
      ctx.fillStyle = gl; ctx.fillRect(0, 690, W, 36);
      break;
    }
  }
  ctx.restore();
}

/* The field. This is the single strongest cue that the player is in a stadium
   rather than a meadow, so every level gets turf, stripes, yard lines and a
   painted end zone behind the goalpost. The theme only tints it. */
function drawGround(){
  const t = theme();
  const base = mix('#20512c', t.ground[0], .30);
  const gg = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  gg.addColorStop(0, mix(base, '#ffffff', .16));
  gg.addColorStop(1, mix(base, '#000000', .48));
  ctx.fillStyle = gg; ctx.fillRect(-BLEED, GROUND_Y, W+BLEED*2, H - GROUND_Y + BLEED);

  /* mower stripes running with the yard lines */
  ctx.fillStyle = 'rgba(255,255,255,.035)';
  for (let x = -52-BLEED; x < W+BLEED; x += 104)
    ctx.fillRect(x, GROUND_Y, 52, H - GROUND_Y + BLEED);

  /* the home end zone sits behind the goalpost, painted in the away team's colour
     because this is their house on every level but the last */
  const ez = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  ez.addColorStop(0, mix(t.accent, '#000000', .52));
  ez.addColorStop(1, mix(t.accent, '#000000', .74));
  ctx.fillStyle = ez; ctx.fillRect(-BLEED, GROUND_Y, 272+BLEED, H - GROUND_Y + BLEED);
  ctx.fillStyle = 'rgba(255,255,255,.42)';
  ctx.fillRect(268, GROUND_Y, 4, H - GROUND_Y + BLEED);

  /* sideline */
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.fillRect(-BLEED, GROUND_Y + 3, W+BLEED*2, 3);

  /* yard lines, hash marks and numbers */
  ctx.font = '800 13px Outfit, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let i = 0; i <= 11; i++){
    const x = 272 + i * 96;
    if (x > W) break;
    ctx.fillStyle = 'rgba(255,255,255,.30)';
    ctx.fillRect(x - 1.5, GROUND_Y + 6, 3, H - GROUND_Y);
    /* hashes between the lines */
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    for (let k = 1; k < 5; k++)
      ctx.fillRect(x + k * 19, GROUND_Y + 30, 8, 2.4);
    const yd = [50,45,40,35,30,25,20,15,10,5,0,0][i];
    if (yd > 0){
      ctx.fillStyle = 'rgba(255,255,255,.22)';
      ctx.fillText(String(yd), x + 20, GROUND_Y + 44);
    }
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

  /* a few blades so the turf is not a flat plane */
  ctx.strokeStyle = t.tuft; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 10; x < W; x += 34){
    ctx.moveTo(x, GROUND_Y + 2);
    ctx.lineTo(x + (x % 68 === 10 ? 4 : -4), GROUND_Y - 9);
  }
  ctx.stroke();
}

/* Floodlight pools washing across the turf. Drawn after the field so the light
   sits on top of it, additively, the way stadium light actually behaves. */
const RIGS = [[124,150],[438,118],[962,118],[1290,150]];
function drawFieldLight(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  RIGS.forEach(([x,y])=>{
    const pool = ctx.createRadialGradient(x, GROUND_Y + 10, 6, x, GROUND_Y + 10, 320);
    pool.addColorStop(0, 'rgba(255,246,214,.14)');
    pool.addColorStop(.45,'rgba(255,240,200,.055)');
    pool.addColorStop(1, 'rgba(255,236,190,0)');
    ctx.fillStyle = pool;
    ctx.beginPath(); ctx.ellipse(x, GROUND_Y + 14, 320, 86, 0, 0, Math.PI*2); ctx.fill();
  });
  ctx.restore();
}

/* The rigs themselves, plus the beam hanging in the night air. The pole fades out
   below the bank rather than running to the turf: a full-length pole draws a hard
   line straight through the play area and reads as a dangling wire. */
function drawFloodlights(){
  ctx.save();
  RIGS.forEach(([x,y])=>{
    /* beam: a soft cone from the lamp bank down to the field */
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const beam = ctx.createLinearGradient(x, y, x, GROUND_Y);
    beam.addColorStop(0, 'rgba(255,246,214,.075)');
    beam.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(x - 28, y + 14); ctx.lineTo(x + 28, y + 14);
    ctx.lineTo(x + 176, GROUND_Y); ctx.lineTo(x - 176, GROUND_Y);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    /* pole and lattice, fading into the dark below */
    const foot = y + 210;
    const pg = ctx.createLinearGradient(0, y + 16, 0, foot);
    pg.addColorStop(0, 'rgba(14,10,18,.88)');
    pg.addColorStop(.62,'rgba(14,10,18,.40)');
    pg.addColorStop(1, 'rgba(14,10,18,0)');
    ctx.strokeStyle = pg; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(x - 5, y + 16); ctx.lineTo(x - 12, foot);
    ctx.moveTo(x + 5, y + 16); ctx.lineTo(x + 12, foot);
    ctx.stroke();
    ctx.lineWidth = 1.8;
    for (let k = 0; k < 6; k++){
      const f1 = k/6, f2 = (k+1)/6;
      const y1 = y + 16 + (foot - y - 16)*f1, y2 = y + 16 + (foot - y - 16)*f2;
      const w1 = 5 + 7*f1, w2 = 5 + 7*f2;
      ctx.beginPath();
      ctx.moveTo(x - w1, y1); ctx.lineTo(x + w2, y2);
      ctx.moveTo(x + w1, y1); ctx.lineTo(x - w2, y2);
      ctx.stroke();
    }

    /* lamp bank */
    ctx.fillStyle = 'rgba(18,14,22,.94)';
    ctx.fillRect(x - 34, y - 2, 68, 17);
    ctx.fillStyle = 'rgba(255,248,222,.94)';
    for (let r = 0; r < 2; r++)
      for (let c = 0; c < 5; c++)
        ctx.fillRect(x - 30 + c*13, y + 1 + r*7, 9, 5);
    /* halo */
    const halo = ctx.createRadialGradient(x, y + 7, 2, x, y + 7, 78);
    halo.addColorStop(0, 'rgba(255,248,220,.32)');
    halo.addColorStop(1, 'rgba(255,244,200,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(x, y + 7, 78, 0, Math.PI*2); ctx.fill();
  });
  ctx.restore();
}

/* Camera flashes ripple through a crowd that is actually drawn. */
function drawCrowdFlashes(){
  const k = theme().props;
  if (k !== 'brazos' && k !== 'levee') return;
  const lo = k === 'brazos' ? 280 : 315, hi = k === 'brazos' ? 580 : 550;
  for (let i = 0; i < 3; i++){
    if (Math.random() > .14) continue;
    const x = Math.random()*W, y = lo + Math.random()*(hi - lo);
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(x, y, 1.9, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.20)';
    ctx.beginPath(); ctx.arc(x, y, 6.5, 0, Math.PI*2); ctx.fill();
  }
}

function drawShadows(){
  ctx.fillStyle = 'rgba(0,0,0,1)';
  [...blocks, ...grumps, ...flock].forEach(b=>{
    const p = b.plugin;
    const halfH = p && p.kind === 'block' ? Math.max(p.w, p.h)/2 : (b.circleRadius || 24);
    const bottom = b.position.y + halfH;
    const gap = GROUND_Y - bottom;
    if (gap > 170 || gap < -60) return;
    const k = Math.max(0, 1 - Math.max(gap, 0)/170);
    const rw = (p && p.kind === 'block' ? Math.max(p.w, p.h)*.55 : 26) * (0.6 + .4*k);
    ctx.globalAlpha = .30 * k;
    ctx.beginPath();
    ctx.ellipse(b.position.x, GROUND_Y + 5, rw, 6.5, 0, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

/* The launch pad reads as football, not slingshot: a goalpost frames the ball and
   the tiger stands on the crossbar and throws. The physics anchor is unchanged. */
const TIGER = {x: ANCHOR.x - 50, y: ANCHOR.y + 26};

function drawSling(){
  const t = performance.now()/1000;
  const acc = theme().accent;
  const barY = ANCHOR.y + 51;                     /* crossbar */
  const upL = ANCHOR.x - 55, upR = ANCHOR.x + 55;

  /* goalpost: base post, crossbar, two uprights */
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 15;
  ctx.beginPath();
  ctx.moveTo(ANCHOR.x, GROUND_Y+2); ctx.lineTo(ANCHOR.x, barY);
  ctx.moveTo(upL, barY); ctx.lineTo(upR, barY);
  ctx.moveTo(upL, barY); ctx.lineTo(upL, barY-118);
  ctx.moveTo(upR, barY); ctx.lineTo(upR, barY-118);
  ctx.stroke();
  ctx.strokeStyle = acc; ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(ANCHOR.x, GROUND_Y+2); ctx.lineTo(ANCHOR.x, barY);
  ctx.moveTo(upL, barY); ctx.lineTo(upR, barY);
  ctx.moveTo(upL, barY); ctx.lineTo(upL, barY-118);
  ctx.moveTo(upR, barY); ctx.lineTo(upR, barY-118);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.30)'; ctx.lineWidth = 2.6;
  ctx.beginPath();
  ctx.moveTo(ANCHOR.x-3, GROUND_Y-4); ctx.lineTo(ANCHOR.x-3, barY+4);
  ctx.moveTo(upL-3, barY-6); ctx.lineTo(upL-3, barY-112);
  ctx.moveTo(upR-3, barY-6); ctx.lineTo(upR-3, barY-112);
  ctx.stroke();

  /* aim: the tiger tracks the ball while it is on the pad */
  const target = held ? held.position : {x: ANCHOR.x + 40, y: ANCHOR.y};
  drawTiger(TIGER.x, TIGER.y, t, target, dragging);

  /* wind-up: a dashed line of force from paw to ball, brighter the harder the pull */
  if (held){
    const pull = Math.min(Vector.magnitude(Vector.sub(ANCHOR, held.position)), MAX_PULL) / MAX_PULL;
    ctx.save();
    ctx.strokeStyle = `rgba(253,208,35,${(.25 + pull*.6).toFixed(3)})`;
    ctx.lineWidth = 2 + pull*2.6;
    ctx.setLineDash([7, 6]); ctx.lineDashOffset = -t*26;
    ctx.beginPath();
    ctx.moveTo(TIGER.x + 26, TIGER.y - 10);
    ctx.lineTo(held.position.x, held.position.y);
    ctx.stroke();
    ctx.restore();
  }

  if (dragging && held){
    const pull = Vector.sub(ANCHOR, held.position);
    let px = held.position.x, py = held.position.y, vx = pull.x*LAUNCH, vy = pull.y*LAUNCH;
    ctx.fillStyle = '#fdf6ff';
    for (let i=0;i<200;i++){
      vx *= AIR; vy = vy*AIR + GRAV; px += vx; py += vy;
      if (py > GROUND_Y - 20 || px > W + 40) break;
      if (i % 4 === 0){
        ctx.globalAlpha = Math.max(.14, .62 - i*.004);
        ctx.beginPath(); ctx.arc(px, py, Math.max(1.6, 3.4 - i*.009), 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
}

/* The player character. Orange bengal coat, black stripes, purple and gold collar.
   He never leaves the pad; the football is what flies. */
function drawTiger(x, y, t, target, winding){
  const breathe = Math.sin(t*1.9)*1.4;
  const aim = Math.atan2(target.y - (y-10), target.x - (x+26));
  ctx.save();
  ctx.translate(x, y + breathe);
  const crouch = winding ? .93 : 1;
  ctx.scale(1, crouch);

  /* tail curling behind */
  ctx.strokeStyle = '#d1701f'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-20, 12);
  ctx.quadraticCurveTo(-46, 8 + Math.sin(t*2.2)*7, -44, -20 + Math.sin(t*2.2)*8);
  ctx.stroke();
  ctx.strokeStyle = '#2a1608'; ctx.lineWidth = 2.6;
  for (let i=0;i<3;i++){
    const f = .35 + i*.22;
    const tx = -20 + (-24)*f, ty = 12 + (-26)*f + Math.sin(t*2.2)*7*f;
    ctx.beginPath(); ctx.moveTo(tx-3, ty-4); ctx.lineTo(tx+3, ty+2); ctx.stroke();
  }

  /* haunches and feet on the crossbar */
  ctx.fillStyle = '#b85c17';
  ctx.beginPath(); ctx.ellipse(-12, 16, 13, 9, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2a1608';
  ctx.beginPath(); ctx.ellipse(-13, 26, 8, 4, 0, 0, Math.PI*2);
  ctx.ellipse(9, 26, 8, 4, 0, 0, Math.PI*2); ctx.fill();

  /* body */
  const bg = ctx.createRadialGradient(-7,-9,4, 0,0,29);
  bg.addColorStop(0, '#ffb45c');
  bg.addColorStop(.55, '#e8801f');
  bg.addColorStop(1, '#a0500f');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(0,0,25,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 4.4; ctx.stroke();
  ctx.strokeStyle = '#5c2f0c'; ctx.lineWidth = 2.4; ctx.stroke();

  /* stripes, clipped to the body */
  ctx.save();
  ctx.beginPath(); ctx.arc(0,0,24,0,Math.PI*2); ctx.clip();
  ctx.strokeStyle = '#2a1608'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  [[-19,-14,-7,-19],[-21,-2,-9,-6],[-19,10,-7,7],[16,-16,7,-20],[19,-4,9,-8],[17,8,7,6]].forEach(v=>{
    ctx.beginPath(); ctx.moveTo(v[0],v[1]); ctx.quadraticCurveTo((v[0]+v[2])/2, (v[1]+v[3])/2 - 3, v[2], v[3]); ctx.stroke();
  });
  ctx.restore();

  /* ears */
  ctx.fillStyle = '#e8801f'; ctx.strokeStyle = '#5c2f0c'; ctx.lineWidth = 2;
  [-14, 14].forEach(ex=>{
    ctx.beginPath(); ctx.arc(ex, -21, 7.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  });
  ctx.fillStyle = '#2a1608';
  [-14, 14].forEach(ex=>{ ctx.beginPath(); ctx.arc(ex, -21, 3.6, 0, Math.PI*2); ctx.fill(); });

  /* muzzle, nose, whiskers */
  ctx.fillStyle = '#fff4e2';
  ctx.beginPath(); ctx.ellipse(-5, 9, 8.5, 6.5, 0, 0, Math.PI*2);
  ctx.ellipse(6, 9, 8.5, 6.5, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2a1608';
  ctx.beginPath(); ctx.moveTo(-3.6,3.4); ctx.lineTo(3.6,3.4); ctx.lineTo(0,7.4); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(42,22,8,.55)'; ctx.lineWidth = 1;
  [[-9,8,-22,5],[-9,10,-22,11],[9,8,22,5],[9,10,22,11]].forEach(v=>{
    ctx.beginPath(); ctx.moveTo(v[0],v[1]); ctx.lineTo(v[2],v[3]); ctx.stroke();
  });

  /* eyes: fierce, tracking the target */
  const look = Math.max(-2.2, Math.min(2.2, Math.cos(aim)*2.2));
  ctx.fillStyle = '#fffaf0';
  ctx.beginPath(); ctx.arc(-7,-5,6.4,0,Math.PI*2); ctx.arc(8,-5,6.4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1d7a3f';
  ctx.beginPath(); ctx.arc(-7+look,-5,3.6,0,Math.PI*2); ctx.arc(8+look,-5,3.6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#0a0d08';
  ctx.beginPath(); ctx.ellipse(-7+look,-5,1.5,3.1,0,0,Math.PI*2);
  ctx.ellipse(8+look,-5,1.5,3.1,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.arc(-8.4+look,-6.8,1.2,0,Math.PI*2); ctx.arc(6.6+look,-6.8,1.2,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#2a1608'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-15,-13); ctx.lineTo(-2,-10); ctx.moveTo(16,-13); ctx.lineTo(3,-10); ctx.stroke();

  /* throwing arm swinging toward the ball */
  ctx.save();
  ctx.translate(14, -6);
  ctx.rotate(Math.max(-1.15, Math.min(1.15, aim)) * .55 - .25);
  ctx.strokeStyle = '#d1701f'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(17,4); ctx.stroke();
  ctx.fillStyle = '#fff4e2';
  ctx.beginPath(); ctx.arc(19,5,5,0,Math.PI*2); ctx.fill();
  ctx.restore();

  /* collar: purple band, gold tag */
  ctx.strokeStyle = '#461D7C'; ctx.lineWidth = 5.5;
  ctx.beginPath(); ctx.arc(0, 3, 22, Math.PI*.22, Math.PI*.78); ctx.stroke();
  ctx.fillStyle = '#FDD023';
  ctx.beginPath(); ctx.arc(0, 25, 4.4, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ---------- material painting ---------- */
function texture(tex, w, h, skin){
  switch(tex){
    case 'grain': case 'gild':
      ctx.strokeStyle = tex==='gild' ? 'rgba(255,235,180,.5)' : 'rgba(0,0,0,.18)';
      ctx.lineWidth = 1.5;
      for (let i=-1;i<=1;i++){
        ctx.beginPath();
        if (w > h){ ctx.moveTo(-w/2+5, i*h/4); ctx.lineTo(w/2-5, i*h/4); }
        else { ctx.moveTo(i*w/4, -h/2+5); ctx.lineTo(i*w/4, h/2-5); }
        ctx.stroke();
      }
      break;
    case 'plank':
      ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1.4;
      if (w > h){ for (let i=-1;i<=1;i+=2){ ctx.beginPath(); ctx.moveTo(-w/2+4, i*h/5); ctx.lineTo(w/2-4, i*h/5); ctx.stroke(); } }
      else { for (let i=-1;i<=1;i+=2){ ctx.beginPath(); ctx.moveTo(i*w/5, -h/2+4); ctx.lineTo(i*w/5, h/2-4); ctx.stroke(); } }
      ctx.fillStyle = 'rgba(255,230,190,.55)';
      [[-w/2+6,-h/2+6],[w/2-6,-h/2+6],[-w/2+6,h/2-6],[w/2-6,h/2-6]].forEach(([x,y])=>{
        ctx.beginPath(); ctx.arc(x,y,1.5,0,Math.PI*2); ctx.fill();
      });
      break;
    case 'brick':
      ctx.strokeStyle = 'rgba(0,0,0,.22)'; ctx.lineWidth = 1.2;
      for (let y=-h/2+9; y<h/2-2; y+=13){
        ctx.beginPath(); ctx.moveTo(-w/2+2, y); ctx.lineTo(w/2-2, y); ctx.stroke();
      }
      break;
    case 'marble':
      ctx.strokeStyle = 'rgba(120,110,130,.42)'; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-w/2+3, -h/4); ctx.quadraticCurveTo(0, h/8, w/2-3, -h/6); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-w/2+5, h/3); ctx.quadraticCurveTo(w/6, 0, w/2-4, h/4); ctx.stroke();
      break;
    case 'coral':
      ctx.fillStyle = 'rgba(255,190,170,.45)';
      for (let i=0;i<5;i++){
        const cx = (i/4-.5)*(w-10), cy = ((i%2)-.5)*(h-12)*.6;
        ctx.beginPath(); ctx.arc(cx, cy, 3.2, 0, Math.PI*2); ctx.fill();
      }
      break;
    case 'barnacle':
      ctx.fillStyle = 'rgba(220,240,240,.4)';
      for (let i=0;i<4;i++){
        const cx = (Math.sin(i*3.1)*.35)*w, cy = (Math.cos(i*2.3)*.35)*h;
        ctx.beginPath(); ctx.arc(cx, cy, 2.6, 0, Math.PI*2); ctx.fill();
      }
      break;
    case 'rune':
      ctx.strokeStyle = 'rgba(90,70,40,.55)'; ctx.lineWidth = 1.6;
      for (let i=-1;i<=1;i++){
        const cx = w>h ? i*w/4 : 0, cy = w>h ? 0 : i*h/4;
        ctx.beginPath();
        ctx.moveTo(cx-4, cy-4); ctx.lineTo(cx+4, cy-4); ctx.lineTo(cx, cy+4); ctx.closePath();
        ctx.stroke();
      }
      break;
    case 'checker': {
      /* the end-zone check: the single strongest read on the Knoxville level */
      const sz = 11;
      ctx.save();
      ctx.beginPath(); ctx.roundRect(-w/2+2, -h/2+2, w-4, h-4, 3); ctx.clip();
      for (let cx=-w/2; cx<w/2; cx+=sz)
        for (let cy=-h/2; cy<h/2; cy+=sz){
          const ix = Math.round((cx+w/2)/sz), iy = Math.round((cy+h/2)/sz);
          if ((ix+iy) % 2){ ctx.fillStyle = 'rgba(255,130,0,.8)'; ctx.fillRect(cx, cy, sz, sz); }
        }
      ctx.restore();
      break;
    }
    case 'houndstooth': {
      const pat = houndPattern();
      if (pat){
        ctx.save();
        ctx.globalAlpha = .34;
        ctx.fillStyle = pat;
        ctx.beginPath(); ctx.roundRect(-w/2+2, -h/2+2, w-4, h-4, 3); ctx.fill();
        ctx.restore();
      }
      break;
    }
    case 'sheen': case 'bubble': case 'ice': case 'bottle':
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-w/2+4, h/2-4); ctx.lineTo(w/2-4, -h/2+4); ctx.stroke();
      if (tex === 'ice'){
        ctx.beginPath(); ctx.moveTo(-w/2+4, -h/2+4); ctx.lineTo(w/2-4, h/2-4); ctx.stroke();
      }
      if (tex === 'bubble'){
        ctx.fillStyle = 'rgba(255,255,255,.5)';
        ctx.beginPath(); ctx.arc(-w/6, -h/6, Math.min(w,h)/6, 0, Math.PI*2); ctx.fill();
      }
      break;
    case 'moss':
      ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 1.2;
      for (let y=-h/2+9; y<h/2-2; y+=13){
        ctx.beginPath(); ctx.moveTo(-w/2+2, y); ctx.lineTo(w/2-2, y); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(140,210,120,.4)';
      for (let i=0;i<4;i++){
        const cx = (Math.sin(i*2.7)*.34)*w, cy = (Math.cos(i*1.9)*.34)*h;
        ctx.beginPath(); ctx.ellipse(cx, cy, 4, 2.2, i, 0, Math.PI*2); ctx.fill();
      }
      break;
    case 'rivet':
      ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1.3;
      if (w > h){ ctx.beginPath(); ctx.moveTo(-w/2+4,0); ctx.lineTo(w/2-4,0); ctx.stroke(); }
      else { ctx.beginPath(); ctx.moveTo(0,-h/2+4); ctx.lineTo(0,h/2-4); ctx.stroke(); }
      ctx.fillStyle = 'rgba(255,222,170,.6)';
      { const n = Math.max(2, Math.floor(Math.max(w,h)/22));
        for (let i=0;i<n;i++){
          const t = (i+.5)/n - .5;
          const rx = w > h ? t*(w-12) : -w/2+5, ry = w > h ? -h/2+5 : t*(h-12);
          ctx.beginPath(); ctx.arc(rx, ry, 1.6, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(w>h?rx:w/2-5, w>h?h/2-5:ry, 1.6, 0, Math.PI*2); ctx.fill();
        } }
      break;
    case 'facet':
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-w/2+3,-h/2+3); ctx.lineTo(w/2-3, h/2-3);
      ctx.moveTo(w/2-3,-h/2+3); ctx.lineTo(-w/2+3, h/2-3);
      ctx.moveTo(0,-h/2+3); ctx.lineTo(0,h/2-3); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.22)';
      ctx.beginPath();
      ctx.moveTo(-w/2+3,-h/2+3); ctx.lineTo(0,-h/2+3); ctx.lineTo(0,0); ctx.closePath(); ctx.fill();
      break;
    case 'stained':
      ctx.fillStyle = 'rgba(255,120,150,.35)'; ctx.fillRect(-w/2+3, -h/2+3, (w-6)/2, (h-6)/2);
      ctx.fillStyle = 'rgba(120,180,255,.35)'; ctx.fillRect(0, 0, (w-6)/2, (h-6)/2);
      ctx.strokeStyle = 'rgba(60,40,80,.6)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(0,-h/2+3); ctx.lineTo(0,h/2-3);
      ctx.moveTo(-w/2+3,0); ctx.lineTo(w/2-3,0); ctx.stroke();
      break;
  }
}

function drawBlock(b){
  const p = b.plugin, skin = theme().mats[p.mat];
  ctx.save();
  ctx.translate(b.position.x, b.position.y);
  ctx.rotate(b.angle);
  const w = p.w, h = p.h;
  const baseFill = p.rubble ? mix(skin.fill, skin.line, .45) : skin.fill;
  /* light falls from the upper left: gradient across the short axis */
  let g;
  if (w >= h){ g = ctx.createLinearGradient(0, -h/2, 0, h/2); }
  else { g = ctx.createLinearGradient(-w/2, 0, w/2, 0); }
  g.addColorStop(0, mix(baseFill, '#ffffff', .22));
  g.addColorStop(.45, baseFill);
  g.addColorStop(1, mix(baseFill, '#000000', .30));
  ctx.fillStyle = g;
  ctx.strokeStyle = skin.line; ctx.lineWidth = p.rubble ? 2 : 2.5;
  ctx.beginPath(); ctx.roundRect(-w/2, -h/2, w, h, p.rubble ? 3 : 4); ctx.fill(); ctx.stroke();
  /* bevel highlight along the lit edge */
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  if (w >= h){ ctx.moveTo(-w/2+4, -h/2+2.5); ctx.lineTo(w/2-4, -h/2+2.5); }
  else { ctx.moveTo(-w/2+2.5, -h/2+4); ctx.lineTo(-w/2+2.5, h/2-4); }
  ctx.stroke();
  if (p.rubble){
    ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-w/2+3,-h/2+5); ctx.lineTo(-w/6,-h/6); ctx.lineTo(w/2-4,h/4); ctx.stroke();
  } else texture(skin.tex, w, h, skin);
  /* the rigs are overhead, so every member catches warm light on top and
     goes to shadow at its foot; this is what stops the blocks reading flat */
  const ao = ctx.createLinearGradient(0, -h/2, 0, h/2);
  ao.addColorStop(0, 'rgba(255,238,198,.13)');
  ao.addColorStop(.45,'rgba(0,0,0,0)');
  ao.addColorStop(1, 'rgba(0,0,0,.24)');
  ctx.fillStyle = ao;
  ctx.beginPath(); ctx.roundRect(-w/2, -h/2, w, h, p.rubble ? 3 : 4); ctx.fill();
  /* a load-bearing glass member is a keystone: give it visible stress so the player
     can read the structure instead of guessing */
  if (p.bearing && p.mat === 'glass' && !p.rubble){
    const pulse = .45 + .3*Math.sin(performance.now()/420);
    ctx.strokeStyle = `rgba(255,255,255,${pulse.toFixed(3)})`;
    ctx.lineWidth = 1.3;
    if (h >= w){
      for (let i=-1;i<=1;i++){
        const y = i*h/3.2;
        ctx.beginPath();
        ctx.moveTo(-w/2+3, y); ctx.lineTo(0, y+5); ctx.lineTo(w/2-3, y);
        ctx.stroke();
      }
    } else {
      for (let i=-1;i<=1;i++){
        const x = i*w/3.2;
        ctx.beginPath();
        ctx.moveTo(x, -h/2+3); ctx.lineTo(x+5, 0); ctx.lineTo(x, h/2-3);
        ctx.stroke();
      }
    }
    /* travelling glint along the long axis */
    const span = Math.max(w, h);
    const t2 = ((performance.now()/900) % 1) * span - span/2;
    const gl = h >= w
      ? ctx.createLinearGradient(0, t2-16, 0, t2+16)
      : ctx.createLinearGradient(t2-16, 0, t2+16, 0);
    gl.addColorStop(0,'rgba(255,255,255,0)');
    gl.addColorStop(.5,'rgba(255,255,255,.42)');
    gl.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.roundRect(-w/2+1.5, -h/2+1.5, w-3, h-3, 3); ctx.fill();
  }
  const dmg = 1 - Math.max(p.hp,0)/MATS[p.mat].hp;
  if (dmg > .35){
    ctx.strokeStyle = `rgba(20,10,30,${Math.min(dmg,.8)})`; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-w/4,-h/4); ctx.lineTo(0,0); ctx.lineTo(w/5,-h/6);
    ctx.moveTo(0,0); ctx.lineTo(-w/6, h/3);
    ctx.stroke();
  }
  ctx.restore();
}

/* Defenders: round rival critters. Identity is carried entirely by colour and
   headgear, never by a logo. Some kits also reshape the face, so the muzzle pass
   runs after the eyes and can take over the mouth. */
function drawGrump(b){
  const p = b.plugin, t = theme(), g = t.grump;
  const now = performance.now();
  const since = now - (p.hurt||0);
  const flash = since < 140;
  const kit = hatFor(g, p);
  /* a struck defender squashes and springs back */
  const hitK = since < 260 ? Math.sin((1 - since/260) * Math.PI) : 0;
  /* each one blinks on its own clock so the row never blinks in unison */
  const bt = (now/1000 + (p.variant||0)*1.63) % 4.4;
  const blinking = bt > 4.22;
  ctx.save();
  ctx.translate(b.position.x, b.position.y);
  ctx.rotate(b.angle);
  ctx.scale(1 + hitK*.16, 1 - hitK*.14);
  const tone = flash ? '#ffe08a' : (p.hp > 1.7 ? g.body : p.hp > .9 ? mix(g.body, g.dark, .35) : mix(g.body, g.dark, .6));
  behindHead(kit, g);
  /* seated contact shadow so the body sits on the beam instead of floating */
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(0, 27, 20, 5, 0, 0, Math.PI*2); ctx.fill();
  const rg = ctx.createRadialGradient(-8,-10,4, 0,0,28);
  rg.addColorStop(0, mix(tone, '#ffffff', .3));
  rg.addColorStop(.6, tone);
  rg.addColorStop(1, mix(tone, g.dark, .5));
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.arc(0,0,26,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 5; ctx.stroke();
  ctx.strokeStyle = g.dark; ctx.lineWidth = 3; ctx.stroke();
  /* rim light picked up from the floodlights */
  ctx.strokeStyle = 'rgba(255,240,205,.30)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0,0,24.5,Math.PI*1.12,Math.PI*1.86); ctx.stroke();
  /* belly shade + stubby feet */
  ctx.fillStyle = 'rgba(0,0,0,.14)';
  ctx.beginPath(); ctx.ellipse(0, 14, 15, 8, 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = g.dark;
  ctx.beginPath(); ctx.ellipse(-11, 25, 6, 3.4, 0, 0, Math.PI*2);
  ctx.ellipse(11, 25, 6, 3.4, 0, 0, Math.PI*2); ctx.fill();
  drawHat(kit, g);
  if (blinking){
    ctx.strokeStyle = g.dark; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-14,-3); ctx.lineTo(-2,-3); ctx.moveTo(2,-3); ctx.lineTo(14,-3); ctx.stroke();
  } else {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-8,-3,7,0,Math.PI*2); ctx.arc(8,-3,7,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = g.dark;
    /* the pupils shrink as the defender takes damage: fear reads at a glance */
    const pr = p.hp > 1.7 ? 3.4 : p.hp > .9 ? 2.7 : 2.0;
    ctx.beginPath(); ctx.arc(-7,-2,pr,0,Math.PI*2); ctx.arc(9,-2,pr,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath(); ctx.arc(-8.2,-3.4,1.1,0,Math.PI*2); ctx.arc(7.8,-3.4,1.1,0,Math.PI*2); ctx.fill();
  }
  ctx.strokeStyle = g.dark; ctx.lineWidth = 3; ctx.lineCap = 'round';
  /* brows drop further the more damage is on them */
  const brow = p.hp > 1.7 ? 0 : p.hp > .9 ? 1.6 : 3.2;
  ctx.beginPath();
  ctx.moveTo(-15,-12+brow); ctx.lineTo(-3,-8+brow);
  ctx.moveTo(15,-12+brow); ctx.lineTo(3,-8+brow); ctx.stroke();
  const covered = drawMuzzle(kit, g);
  if (!covered){
    ctx.strokeStyle = g.dark; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0,18,8,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
  }
  ctx.restore();
}

/* a theme may carry two kits; the variant index keeps the mix stable per grump */
function hatFor(g, p){
  return (g.hat2 && (p.variant % 3) === 1) ? g.hat2 : g.hat;
}

/* Houndstooth is a real check, so it is baked once into a pattern rather than
   drawn shape by shape every frame. */
let _hound = null;
function houndPattern(){
  if (_hound) return _hound;
  const c = document.createElement('canvas');
  c.width = c.height = 12;
  const x = c.getContext('2d');
  x.fillStyle = '#f2efe9'; x.fillRect(0,0,12,12);
  x.fillStyle = '#17141a';
  x.fillRect(0,0,6,6); x.fillRect(6,6,6,6);
  x.beginPath(); x.moveTo(6,0); x.lineTo(9,0); x.lineTo(6,3); x.closePath(); x.fill();
  x.beginPath(); x.moveTo(0,6); x.lineTo(3,6); x.lineTo(0,9); x.closePath(); x.fill();
  x.beginPath(); x.moveTo(12,6); x.lineTo(12,9); x.lineTo(9,6); x.closePath(); x.fill();
  x.beginPath(); x.moveTo(6,12); x.lineTo(9,12); x.lineTo(6,9); x.closePath(); x.fill();
  _hound = ctx.createPattern(c, 'repeat');
  return _hound;
}

/* pieces that belong behind the head: ears, ruffs, fins seen from behind */
function behindHead(kit, g){
  if (kit === 'houndstooth'){
    ctx.fillStyle = mix(g.body, g.dark, .45);
    ctx.beginPath(); ctx.ellipse(-25,-2,11,15,-.35,0,Math.PI*2);
    ctx.ellipse(25,-2,11,15,.35,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = g.dark; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(-25,-2,11,15,-.35,0,Math.PI*2);
    ctx.ellipse(25,-2,11,15,.35,0,Math.PI*2); ctx.stroke();
  }
  if (kit === 'collie'){
    ctx.fillStyle = '#f0ead8';
    ctx.beginPath(); ctx.ellipse(0,6,32,26,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(180,140,90,.55)';
    ctx.beginPath(); ctx.ellipse(0,12,30,20,0,0,Math.PI); ctx.fill();
  }
  if (kit === 'houndears'){
    ctx.fillStyle = '#3a3026';
    ctx.beginPath(); ctx.ellipse(-24,6,9,20,.16,0,Math.PI*2);
    ctx.ellipse(24,6,9,20,-.16,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(160,102,44,.6)';
    ctx.beginPath(); ctx.ellipse(-24,12,7,11,.16,0,Math.PI*2);
    ctx.ellipse(24,12,7,11,-.16,0,Math.PI*2); ctx.fill();
  }
  if (kit === 'spikecollar'){
    ctx.fillStyle = mix(g.body, g.dark, .5);
    ctx.beginPath(); ctx.ellipse(-23,-8,8,10,-.4,0,Math.PI*2);
    ctx.ellipse(23,-8,8,10,.4,0,Math.PI*2); ctx.fill();
  }
}

function drawHat(kit, g){
  const d = g.dark, a = theme().accent;
  ctx.fillStyle = d;
  switch(kit){

    /* Nashville: naval fore-and-aft hat, gold braid, anchor pin */
    case 'bicorne':
      ctx.fillStyle = '#17171c';
      ctx.beginPath();
      ctx.moveTo(-30,-14); ctx.quadraticCurveTo(-16,-40,0,-38);
      ctx.quadraticCurveTo(16,-40,30,-14);
      ctx.quadraticCurveTo(0,-24,-30,-14); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#C9A96A'; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(-30,-14); ctx.quadraticCurveTo(-16,-40,0,-38);
      ctx.quadraticCurveTo(16,-40,30,-14); ctx.stroke();
      ctx.strokeStyle = '#C9A96A'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0,-33); ctx.lineTo(0,-23);
      ctx.moveTo(-4,-30); ctx.lineTo(4,-30);
      ctx.moveTo(-5,-24); ctx.quadraticCurveTo(0,-19,5,-24); ctx.stroke();
      break;

    /* Lexington: quartered jockey silks */
    case 'jockey':
      ctx.fillStyle = '#0033A0';
      ctx.beginPath(); ctx.arc(0,-18,17,Math.PI,0); ctx.fill();
      ctx.fillStyle = '#f4f6fa';
      ctx.beginPath(); ctx.moveTo(0,-18); ctx.arc(0,-18,17,Math.PI,Math.PI*1.5); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0,-18); ctx.arc(0,-18,17,Math.PI*1.5,Math.PI*2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#0033A0';
      ctx.beginPath(); ctx.moveTo(0,-18); ctx.arc(0,-18,17,Math.PI,Math.PI*1.5); ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#f4f6fa';
      ctx.beginPath(); ctx.arc(0,-33,4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#0033A0';
      ctx.beginPath(); ctx.ellipse(14,-16,10,3.6,-.2,0,Math.PI*2); ctx.fill();
      break;

    /* Columbia MO: tiger ears and brow stripes */
    case 'tigerears':
      ctx.fillStyle = mix(g.body,'#ffffff',.18); ctx.strokeStyle = d; ctx.lineWidth = 2;
      [-15,15].forEach(ex=>{
        ctx.beginPath(); ctx.moveTo(ex-9,-19); ctx.quadraticCurveTo(ex,-36,ex+9,-19);
        ctx.quadraticCurveTo(ex,-23,ex-9,-19); ctx.closePath(); ctx.fill(); ctx.stroke();
      });
      ctx.fillStyle = d;
      [-15,15].forEach(ex=>{
        ctx.beginPath(); ctx.moveTo(ex-4,-22); ctx.quadraticCurveTo(ex,-32,ex+4,-22);
        ctx.closePath(); ctx.fill();
      });
      ctx.strokeStyle = d; ctx.lineWidth = 3; ctx.lineCap = 'round';
      [[-9,-19,-5,-25],[0,-21,0,-27],[9,-19,5,-25]].forEach(v=>{
        ctx.beginPath(); ctx.moveTo(v[0],v[1]); ctx.lineTo(v[2],v[3]); ctx.stroke();
      });
      break;

    /* Starkville: folded bulldog ears (the bell hangs in the muzzle pass) */
    case 'cowbell':
      ctx.fillStyle = mix(g.body, g.dark, .45); ctx.strokeStyle = d; ctx.lineWidth = 2;
      [-1,1].forEach(s=>{
        ctx.beginPath();
        ctx.moveTo(s*15,-20); ctx.quadraticCurveTo(s*30,-24,s*29,-6);
        ctx.quadraticCurveTo(s*22,-8,s*15,-14); ctx.closePath(); ctx.fill(); ctx.stroke();
      });
      ctx.fillStyle = 'rgba(255,255,255,.16)';
      ctx.beginPath(); ctx.ellipse(-22,-14,5,6,-.4,0,Math.PI*2);
      ctx.ellipse(22,-14,5,6,.4,0,Math.PI*2); ctx.fill();
      break;

    /* Fayetteville: a bristled dorsal ridge */
    case 'ridgeback':
      ctx.fillStyle = mix(d,'#ffffff',.16);
      for (let i=-3;i<=3;i++){
        const h = 34 - Math.abs(i)*4.5;
        ctx.beginPath();
        ctx.moveTo(i*7-4,-17); ctx.lineTo(i*7 + (i<0?-3:3), -h); ctx.lineTo(i*7+4,-17);
        ctx.closePath(); ctx.fill();
      }
      ctx.strokeStyle = d; ctx.lineWidth = 1.6;
      for (let i=-3;i<=3;i++){
        const h = 34 - Math.abs(i)*4.5;
        ctx.beginPath(); ctx.moveTo(i*7,-18); ctx.lineTo(i*7 + (i<0?-3:3), -h); ctx.stroke();
      }
      break;

    /* South Carolina: rooster comb */
    case 'comb':
      ctx.fillStyle = '#C4172B';
      [[-11,26],[0,32],[11,27]].forEach(([cx,ch])=>{
        ctx.beginPath(); ctx.arc(cx,-ch+4,8.5,Math.PI,0); ctx.fill();
      });
      ctx.fillStyle = 'rgba(255,255,255,.18)';
      [[-11,26],[0,32],[11,27]].forEach(([cx,ch])=>{
        ctx.beginPath(); ctx.arc(cx-2,-ch+2,4,Math.PI,0); ctx.fill();
      });
      break;

    /* Oxford: raked dorsal fin */
    case 'sharkfin':
      ctx.fillStyle = '#9FC5E8'; ctx.strokeStyle = '#4E6E8C'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-15,-19); ctx.quadraticCurveTo(-2,-49,17,-40);
      ctx.quadraticCurveTo(6,-30,14,-20); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      ctx.beginPath();
      ctx.moveTo(-11,-21); ctx.quadraticCurveTo(-2,-44,12,-39);
      ctx.quadraticCurveTo(2,-32,-4,-22); ctx.closePath(); ctx.fill();
      break;

    /* Auburn: three swept eagle feathers */
    case 'warfeathers':
      [[-16,-46,'#8a6a3c'],[0,-52,'#c9a44e'],[16,-45,'#8a6a3c']].forEach(([fx,fy,c],i)=>{
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.moveTo(fx*.45,-18);
        ctx.quadraticCurveTo(fx*.9-5, (fy+18)/2-16, fx, fy);
        ctx.quadraticCurveTo(fx*.9+6, (fy+18)/2-10, fx*.45+6,-18);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(60,40,18,.7)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(fx*.45+3,-18); ctx.quadraticCurveTo(fx*.9, (fy+18)/2-12, fx, fy); ctx.stroke();
      });
      ctx.fillStyle = '#E87722';
      ctx.beginPath(); ctx.ellipse(0,-19,16,4.5,0,0,Math.PI*2); ctx.fill();
      break;

    /* Tennessee: checkerboard cap over hound ears */
    case 'houndears': {
      ctx.save();
      ctx.beginPath(); ctx.arc(0,-18,18,Math.PI,0); ctx.closePath(); ctx.clip();
      for (let cx=-20;cx<20;cx+=8) for (let cy=-38;cy<-16;cy+=8){
        ctx.fillStyle = (((cx+40)/8|0) + ((cy+40)/8|0)) % 2 ? '#FF8200' : '#f6f6f6';
        ctx.fillRect(cx,cy,8,8);
      }
      ctx.restore();
      ctx.strokeStyle = '#4a3a2a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0,-18,18,Math.PI,0); ctx.stroke();
      ctx.fillStyle = '#FF8200';
      ctx.beginPath(); ctx.ellipse(15,-16,10,3.4,-.18,0,Math.PI*2); ctx.fill();
      break;
    }

    /* Gainesville: brow bumps of a gator (snout is in the muzzle pass) */
    case 'gatorsnout':
      ctx.fillStyle = mix(g.body,'#ffffff',.2); ctx.strokeStyle = d; ctx.lineWidth = 2;
      [-11,11].forEach(ex=>{
        ctx.beginPath(); ctx.arc(ex,-16,7,Math.PI,0); ctx.fill(); ctx.stroke();
      });
      ctx.fillStyle = mix(g.body, g.dark, .4);
      for (let i=-2;i<=2;i++){
        ctx.beginPath();
        ctx.moveTo(i*8-3,-20); ctx.lineTo(i*8,-30); ctx.lineTo(i*8+3,-20);
        ctx.closePath(); ctx.fill();
      }
      break;

    /* Georgia: the spikes ride the collar, so only small ears up top */
    case 'spikecollar':
      ctx.fillStyle = mix(g.body, g.dark, .35); ctx.strokeStyle = d; ctx.lineWidth = 1.8;
      [-1,1].forEach(s=>{
        ctx.beginPath();
        ctx.moveTo(s*14,-19); ctx.quadraticCurveTo(s*26,-22,s*24,-8);
        ctx.quadraticCurveTo(s*19,-11,s*14,-15); ctx.closePath(); ctx.fill(); ctx.stroke();
      });
      break;

    /* Norman: a prairie schooner. A ribbed canopy alone reads as a bonnet, so
       the wagon bed and the spoked wheels do the identifying work. */
    case 'wagonbonnet': {
      /* wheels first, so the bed sits over their hubs */
      [-26, 26].forEach(wx=>{
        ctx.fillStyle = '#3A2A18';
        ctx.beginPath(); ctx.arc(wx, -13, 8.6, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#6E5230';
        ctx.beginPath(); ctx.arc(wx, -13, 6.6, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#2A1C0E'; ctx.lineWidth = 1.3;
        for (let i=0;i<4;i++){
          const a2 = i*Math.PI/4;
          ctx.beginPath();
          ctx.moveTo(wx + Math.cos(a2)*6.2, -13 + Math.sin(a2)*6.2);
          ctx.lineTo(wx - Math.cos(a2)*6.2, -13 - Math.sin(a2)*6.2);
          ctx.stroke();
        }
        ctx.fillStyle = '#2A1C0E';
        ctx.beginPath(); ctx.arc(wx, -13, 2.1, 0, Math.PI*2); ctx.fill();
      });
      /* canopy: a flatter arch than a bonnet, overhanging the bed at both ends */
      ctx.fillStyle = '#FDF9D8'; ctx.strokeStyle = '#b5a878'; ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(-25,-19);
      ctx.quadraticCurveTo(-27,-38,0,-38);
      ctx.quadraticCurveTo(27,-38,25,-19);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      /* bows showing through the canvas */
      ctx.strokeStyle = 'rgba(150,138,96,.8)'; ctx.lineWidth = 1.5;
      for (let i=-1;i<=1;i++){
        ctx.beginPath();
        ctx.moveTo(i*12,-19);
        ctx.quadraticCurveTo(i*13.5,-32+Math.abs(i)*3, i*9,-37+Math.abs(i)*2);
        ctx.stroke();
      }
      /* the puckered opening at the front of the canvas */
      ctx.fillStyle = 'rgba(120,104,66,.55)';
      ctx.beginPath(); ctx.ellipse(0,-30,7,8.5,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#FDF9D8';
      ctx.beginPath(); ctx.ellipse(0,-30,4.6,6,0,0,Math.PI*2); ctx.fill();
      /* wagon bed: the flat dark box the canopy rides on */
      ctx.fillStyle = '#6E4E2A';
      ctx.beginPath(); ctx.roundRect(-28,-20,56,9,2); ctx.fill();
      ctx.strokeStyle = '#3A2A14'; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.strokeStyle = '#8F2A2A'; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(-26,-15.5); ctx.lineTo(26,-15.5); ctx.stroke();
      /* tongue and doubletree poking forward */
      ctx.strokeStyle = '#5A4028'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(28,-16); ctx.lineTo(40,-12); ctx.stroke();
      break;
    }

    /* Austin: horns wider than anything else in the game */
    case 'longhorns': {

      [-1,1].forEach(s=>{

    /* Tuscaloosa: houndstooth fedora with a crimson band */
    case 'houndstooth':

      ctx.beginPath();
      ctx.moveTo(-15,-18); ctx.quadraticCurveTo(-16,-38,0,-39);

      ctx.strokeStyle = 'rgba(30,26,34,.75)'; ctx.lineWidth = 1.6;

      ctx.beginPath();
      ctx.moveTo(-15,-18); ctx.quadraticCurveTo(-16,-38,0,-39);
      ctx.quadraticCurveTo(16,-38,15,-18); ctx.stroke();
      ctx.fillStyle = '#9E1B32';
      ctx.beginPath(); ctx.moveTo(-15.5,-22); ctx.lineTo(15.5,-22); ctx.lineTo(15,-17); ctx.lineTo(-15,-17); ctx.closePath(); ctx.fill();
      break;

    /* the finale: the doubters wear a press hat */
    case 'press':
      ctx.fillStyle = '#4a4550';
      ctx.beginPath(); ctx.ellipse(0,-17,25,6.5,0,0,Math.PI*2); ctx.fill();

      ctx.quadraticCurveTo(14,-34,13,-18); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#26232c'; ctx.lineWidth = 1.6; ctx.stroke();

/* Face-extending kit: snouts, beaks, trunks, jowls. Returns true when it has
   taken over the mouth so the default frown is skipped. */
function drawMuzzle(kit, g){
  const d = g.dark;
  switch(kit){

    case 'ridgeback':
      ctx.fillStyle = mix(g.body,'#ffffff',.34); ctx.strokeStyle = d; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0,17,13,9,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = d;
      ctx.beginPath(); ctx.arc(-4.5,17,1.9,0,Math.PI*2); ctx.arc(4.5,17,1.9,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#f4efe2';
      ctx.beginPath(); ctx.moveTo(-11,13); ctx.lineTo(-15,3); ctx.lineTo(-7,12); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(11,13); ctx.lineTo(15,3); ctx.lineTo(7,12); ctx.closePath(); ctx.fill();
      return true;

    case 'comb':
      ctx.fillStyle = '#E8A33C'; ctx.strokeStyle = '#a86e18'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(-8,12); ctx.lineTo(12,17); ctx.lineTo(-8,22); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#C4172B';
      ctx.beginPath(); ctx.ellipse(-3,25,5,7,0,0,Math.PI*2); ctx.fill();
      return true;

    case 'gatorsnout':
      ctx.fillStyle = mix(g.body,'#ffffff',.16); ctx.strokeStyle = d; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-14,10); ctx.quadraticCurveTo(0,6,22,12);
      ctx.quadraticCurveTo(24,18,21,22);
      ctx.quadraticCurveTo(0,26,-14,22); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fbf6e8';
      for (let i=0;i<6;i++){
        const tx = -10 + i*6;
        ctx.beginPath(); ctx.moveTo(tx,15); ctx.lineTo(tx+2.6,21); ctx.lineTo(tx+5,15);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = d;
      ctx.beginPath(); ctx.arc(19,13,1.7,0,Math.PI*2); ctx.fill();
      return true;

    case 'spikecollar': {
      ctx.fillStyle = mix(g.body, g.dark, .25);
      ctx.beginPath(); ctx.ellipse(-10,17,9,7,-.3,0,Math.PI*2);
      ctx.ellipse(10,17,9,7,.3,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = d; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(0,16,7,Math.PI*1.1,Math.PI*1.9); ctx.stroke();
      ctx.strokeStyle = '#1a1614'; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(0,4,25,Math.PI*.20,Math.PI*.80); ctx.stroke();
      ctx.fillStyle = '#c8ccd2';
      for (let i=0;i<5;i++){
        const ang = Math.PI*.24 + i*(Math.PI*.52/4);
        const sx = Math.cos(ang)*25, sy = 4 + Math.sin(ang)*25;
        ctx.beginPath();
        ctx.moveTo(sx-3.4,sy); ctx.lineTo(sx,sy+7); ctx.lineTo(sx+3.4,sy);
        ctx.closePath(); ctx.fill();
      }
      return true;
    }

    case 'cowbell':
      ctx.strokeStyle = '#6b5a3a'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0,4,24,Math.PI*.30,Math.PI*.70); ctx.stroke();
      ctx.fillStyle = '#C9A24A'; ctx.strokeStyle = '#7d6222'; ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(-6,25); ctx.lineTo(-9,37); ctx.lineTo(9,37); ctx.lineTo(6,25);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#e8cd86';
      ctx.beginPath(); ctx.moveTo(-5,26); ctx.lineTo(-7,35); ctx.lineTo(-2,35); ctx.lineTo(-2,26);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#5c4718';
      ctx.beginPath(); ctx.arc(0,38,2.4,0,Math.PI*2); ctx.fill();
      return false;

    case 'houndstooth':
      ctx.fillStyle = mix(g.body, g.dark, .18); ctx.strokeStyle = d; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-7,10); ctx.quadraticCurveTo(6,10,10,20);
      ctx.quadraticCurveTo(14,31,9,36);
      ctx.quadraticCurveTo(4,32,5,24);
      ctx.quadraticCurveTo(3,16,-7,17); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1.2;
      for (let i=0;i<3;i++){
        ctx.beginPath();
        ctx.moveTo(-2+i*3, 14+i*5); ctx.quadraticCurveTo(6+i*2, 16+i*5, 8+i, 21+i*5);
        ctx.stroke();
      }
      return true;

    case 'tigerears':
      ctx.fillStyle = mix(g.body,'#ffffff',.4);
      ctx.beginPath(); ctx.ellipse(-6,17,8,6,0,0,Math.PI*2);
      ctx.ellipse(6,17,8,6,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = d;
      ctx.beginPath(); ctx.moveTo(-3,12); ctx.lineTo(3,12); ctx.lineTo(0,15.6); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = d; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(-4,18,4,0,Math.PI*.85); ctx.arc(4,18,4,Math.PI*.15,Math.PI); ctx.stroke();

  return false;
}

function parseColor(c){
  if (c[0] === '#'){
    const rgb = c.length===4 ? [1,2,3].map(i=>parseInt(c[i]+c[i],16)) : [1,3,5].map(i=>parseInt(c.substr(i,2),16));
    return [...rgb, 1];
  }
  const m = c.match(/rgba?\(([^)]+)\)/);
  if (m){
    const parts = m[1].split(',').map(s=>parseFloat(s));
    return [parts[0], parts[1], parts[2], parts.length > 3 ? parts[3] : 1];
  }
  return null;
}
function mix(a,b,t){
  const A1 = parseColor(a), B1 = parseColor(b);
  if (!A1 || !B1) return b;
  const rgb = [0,1,2].map(i=>Math.round(A1[i]+(B1[i]-A1[i])*t));
  const alpha = A1[3] + (B1[3]-A1[3])*t;
  return alpha >= 1 ? `rgb(${rgb.join(',')})` : `rgba(${rgb.join(',')},${alpha.toFixed(3)})`;
}

/* The launched body stays a circle so every tuned constant still holds. Only the
   painting changed: a leather prolate spheroid that tumbles end over end. */
function drawFootball(b){
  const r = b.circleRadius || 22;
  const flying = !b.isStatic && Vector.magnitude(b.velocity) > 1.5;
  const rx = r*1.30, ry = r*0.86;
  ctx.save();
  ctx.translate(b.position.x, b.position.y);
  ctx.rotate(b.angle + (flying ? 0 : -.18));

  /* leather */
  const lg = ctx.createLinearGradient(-rx*.4, -ry, rx*.5, ry);
  lg.addColorStop(0, '#a9662f');
  lg.addColorStop(.45, '#7d451c');
  lg.addColorStop(1, '#4a2510');
  ctx.fillStyle = lg;
  ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#31170a'; ctx.lineWidth = 2.4; ctx.stroke();

  /* nose caps */
  ctx.fillStyle = 'rgba(58,28,12,.55)';
  ctx.beginPath(); ctx.ellipse(-rx*.86, 0, rx*.16, ry*.42, 0, 0, Math.PI*2);
  ctx.ellipse(rx*.86, 0, rx*.16, ry*.42, 0, 0, Math.PI*2); ctx.fill();

  /* white stripes near each end */
  ctx.strokeStyle = 'rgba(255,250,240,.92)'; ctx.lineWidth = 3.2;
  [-1, 1].forEach(s=>{
    ctx.beginPath();
    ctx.moveTo(s*rx*.52, -ry*.68); ctx.quadraticCurveTo(s*rx*.60, 0, s*rx*.52, ry*.68);
    ctx.stroke();
  });

  /* laces */
  ctx.strokeStyle = '#fdf7ec'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-rx*.30, -ry*.40); ctx.lineTo(rx*.30, -ry*.40); ctx.stroke();
  ctx.lineWidth = 2.2;
  for (let i=-2;i<=2;i++){
    ctx.beginPath();
    ctx.moveTo(i*rx*.145, -ry*.60); ctx.lineTo(i*rx*.145, -ry*.20); ctx.stroke();
  }

  /* highlight */
  ctx.fillStyle = 'rgba(255,226,180,.22)';
  ctx.beginPath(); ctx.ellipse(-rx*.16, -ry*.44, rx*.46, ry*.20, -.16, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

/* ---------- the rainbow ribbon ---------- */
function pushTrail(b){
  const last = trail[trail.length-1];
  if (last && Math.hypot(last.x-b.position.x, last.y-b.position.y) < 3) return;
  trail.push({x:b.position.x, y:b.position.y, life:1});
  if (trail.length > 90) trail.shift();
  if (!reduced && Math.random() < .7){
    particles.push({
      x:b.position.x + (Math.random()-.5)*14, y:b.position.y + (Math.random()-.5)*14,
      vx:(Math.random()-.5)*1.6, vy:(Math.random()-.5)*1.6 - .5,
      life:.85, size:1.4+Math.random()*2.6, spin:0,
      color: Math.random()<.55 ? 'hsl(45, 96%, 62%)' : 'hsl(272, 70%, 62%)'
    });
  }
}
function stepTrail(){ trail.forEach(p=>p.life -= .012); trail = trail.filter(p=>p.life > 0); }
function drawTrail(){
  if (trail.length < 3) return;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  /* a purple wash under a gold core: the ball leaves the home colours, not a rainbow */
  ctx.globalCompositeOperation = 'lighter';
  for (let pass=0; pass<2; pass++){
    for (let i=1;i<trail.length;i++){
      const a = trail[i-1], b = trail[i];
      const t = i/trail.length;
      const width = (pass === 0 ? 21 : 6.5) * t * b.life;
      const alpha = (pass === 0 ? .13 : .60) * b.life;
      ctx.strokeStyle = pass === 0
        ? `rgba(150,96,224,${alpha.toFixed(3)})`
        : `rgba(253,214,88,${alpha.toFixed(3)})`;
      ctx.lineWidth = Math.max(width, .5);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

function floatText(x, y, text, color){
  floaters.push({x, y, text, color, life:1});
}
function stepFloaters(){
  floaters.forEach(f=>{ f.y -= 1.15; f.life -= .011; });
  floaters = floaters.filter(f=>f.life > 0);
}
function drawFloaters(){
  if (!floaters.length) return;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  floaters.forEach(f=>{
    const a = Math.min(1, f.life*1.8);
    const pop = f.life > .86 ? 1 + (f.life-.86)*2.6 : 1;
    ctx.save();
    ctx.translate(f.x, f.y); ctx.scale(pop, pop);
    ctx.font = '900 26px Fraunces, Georgia, serif';
    ctx.lineWidth = 6; ctx.lineJoin = 'round';
    ctx.strokeStyle = `rgba(12,6,20,${(a*.85).toFixed(3)})`;
    ctx.strokeText(f.text, 0, 0);
    ctx.globalAlpha = a;
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, 0, 0);
    ctx.restore();
  });
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha = Math.max(p.life,0);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

/* Players were finishing whole levels without noticing the powers existed, so the
   prompt is now loud, on the ball, and stays up until the play is spent. */
function drawPowerRing(){
  const now = performance.now()/1000;
  if (held){
    ctx.save();
    ctx.translate(held.position.x, held.position.y - 62);
    ctx.globalAlpha = .95;
    ctx.strokeStyle = theme().accent;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0,0,17,now*2, now*2 + Math.PI*1.45); ctx.stroke();
    ctx.fillStyle = '#fdf6ff';
    ctx.font = '700 18px Outfit, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(currentPower.glyph, 0, 1);
    ctx.restore();
    return;
  }
  if (!activeShot || powerUsed) return;
  const b = activeShot;
  const pulse = .74 + .26*Math.sin(now*7);
  const label = currentPower.name.toUpperCase();
  ctx.save();
  ctx.font = '800 14px Outfit, sans-serif';
  const pw = ctx.measureText(label).width + 60;
  /* keep the callout on screen and clear of the ball */
  const above = b.position.y > 150;
  const px = Math.max(pw/2 + 10, Math.min(W - pw/2 - 10, b.position.x));
  const py = above ? Math.max(40, b.position.y - 58) : Math.min(H - 90, b.position.y + 58);
  ctx.translate(px, py);
  ctx.globalAlpha = pulse;
  ctx.fillStyle = 'rgba(12,6,20,.86)';
  ctx.strokeStyle = theme().accent; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.roundRect(-pw/2, -16, pw, 32, 16); ctx.fill(); ctx.stroke();
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = theme().accent;
  ctx.font = '800 17px Outfit, sans-serif';
  ctx.fillText(currentPower.glyph, -pw/2 + 14, 0);
  ctx.fillStyle = '#fdf6ff';
  ctx.font = '800 14px Outfit, sans-serif';
  ctx.fillText(label, -pw/2 + 38, 0);
  /* the instruction itself */
  ctx.globalAlpha = pulse;
  ctx.textAlign = 'center';
  ctx.font = '800 11px Outfit, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.strokeStyle = 'rgba(10,5,16,.9)'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.strokeText('TAP  or  SPACE', 0, 28);
  ctx.fillText('TAP  or  SPACE', 0, 28);
  /* a pointer down to the ball */
  ctx.globalAlpha = pulse * .8;
  ctx.strokeStyle = theme().accent; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, above ? 16 : -16);
  ctx.lineTo(0, above ? 30 : -30);
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ---------- loop ---------- */
/* The scene is vector art, so resolution is just a question of how many real pixels
   we hand the canvas. Render at the display's true pixel ratio, capped by a 4K budget
   so a high-DPI phone doesn't try to fill 30 million pixels a frame. */
const PIXEL_BUDGET = 3840 * 2195;        /* 4K UHD width at the game's 7:4 shape */
let renderScale = 1;                     /* backs off automatically if frames get slow */
function resize(){
  const r = canvas.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  let w = r.width * dpr * renderScale, h = r.height * dpr * renderScale;
  const px = w * h;
  if (px > PIXEL_BUDGET){
    const k = Math.sqrt(PIXEL_BUDGET / px);
    w *= k; h *= k;
  }
  canvas.width = Math.max(320, Math.round(w));
  canvas.height = Math.max(180, Math.round(h));
}
/* Watch real frame cost for a couple of seconds after load. If the machine cannot
   hold ~45fps at full resolution, step down once or twice rather than stutter. */
let perfSamples = 0, perfSum = 0, perfSteps = 0;
function watchPerf(dt){
  if (perfSteps >= 2) return;
  perfSum += dt; perfSamples++;
  if (perfSamples < 140) return;
  const avg = perfSum / perfSamples;
  perfSamples = 0; perfSum = 0;
  if (avg > 22){ renderScale *= .75; perfSteps++; resize(); }
  else perfSteps = 2;                    /* comfortably fast: stop watching */
}
window.addEventListener('resize', ()=>{ resize(); fitCard(); });

let last = performance.now();
function frame(now){
  const dt = Math.min(now - last, 40); last = now;
  watchPerf(dt);
  if (phase === 'play'){
    Engine.update(engine, 16.666);
    if (activeShot) pushTrail(activeShot);
    tickTurn(dt);
  }
  if (phase === 'play' && themeKey() === 'scar'){
    gustNext -= dt/1000;
    if (gustNext <= 0){ gust = 3.2; gustNext = 17 + Math.random()*13; SFX.gust(); }
    if (gust > 0) gust -= dt/1000;
  }
  stepTrail(); stepFloaters();
  spawnAmbient(); stepAmbient();
  spawnFauna(); stepFauna();
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.32; p.vx*=.99; p.life-=.022; });
  particles = particles.filter(p=>p.life>0);

  const s = canvas.width / W;
  let sx = 0, sy = 0;
  if (shake > .12){
    sx = (Math.random()-.5)*shake; sy = (Math.random()-.5)*shake;
    shake *= .86;
  } else shake = 0;
  ctx.setTransform(s,0,0,s, sx*s, sy*s);
  ctx.clearRect(-30,-30,W+60,H+60);
  drawSky();
  drawFauna();
  drawAmbient();
  drawGround();
  drawFieldLight();
  drawShadows();
  drawSling();
  drawTrail();
  blocks.forEach(drawBlock);
  grumps.forEach(drawGrump);
  flock.forEach(drawFootball);
  drawPowerRing();
  drawParticles();
  drawFloaters();
  drawVignette();
  requestAnimationFrame(frame);
}

/* ---------- the surround: sparkle field over the peaks ---------- */
(function seedSparkles(){
  const host = document.getElementById('frame');
  if (!host || reduced) return;
  const N = 54;
  for (let i=0;i<N;i++){
    const s = document.createElement('div');
    /* a bit over a third catch the gold, so the field reads as two colours
       rather than a plain star field over a purple ground */
    const gold = Math.random() < .38;
    s.className = 'spark' + (gold ? ' gold' : '');
    const size = Math.random() < .82 ? 1.6 + Math.random()*1.6 : 3 + Math.random()*1.8;
    /* keep them out of the vertical middle band where the play area sits */
    const edge = Math.random();
    const x = edge < .5 ? Math.random()*26 : 74 + Math.random()*26;
    const y = Math.random()*92;
    s.style.cssText =
      `left:${(Math.random()<.55 ? x : Math.random()*100).toFixed(2)}%;` +
      `top:${y.toFixed(2)}%;width:${size.toFixed(1)}px;height:${size.toFixed(1)}px;` +
      `--d:${(2.2 + Math.random()*4.5).toFixed(2)}s;` +
      `animation-delay:${(Math.random()*5).toFixed(2)}s;` +
      (Math.random() < .3
        ? `box-shadow:0 0 6px ${gold ? 'rgba(255,209,102,.9)' : 'rgba(255,225,255,.85)'};`
        : '');
    host.appendChild(s);
  }
})();

/* ---------- full screen ---------- */
const fullBtn = document.getElementById('full');
function fsActive(){ return document.fullscreenElement || document.webkitFullscreenElement; }
fullBtn.onclick = ()=>{
  const el = document.documentElement;
  if (!fsActive()){
    (el.requestFullscreen || el.webkitRequestFullscreen || (()=>{})).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || (()=>{})).call(document);
  }
};
document.addEventListener('fullscreenchange', ()=>{
  fullBtn.textContent = fsActive() ? '⤫' : '⛶';
  fullBtn.title = fsActive() ? 'Exit full screen' : 'Full screen';
  setTimeout(resize, 60);
});
/* iPad Safari has no Fullscreen API on the document: hide the control there */
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen))
  fullBtn.style.display = 'none';

/* The stage is sized in viewport units, so re-measure whenever that changes. The
   card has to be re-fitted alongside it: turning the phone to landscape is exactly
   the moment its tier should change, and the canvas resize alone would not do it. */
const remeasure = ()=>{ resize(); fitCard(); };
addEventListener('orientationchange', ()=>setTimeout(remeasure, 120));
if (window.visualViewport) visualViewport.addEventListener('resize', ()=>setTimeout(remeasure, 60));

/* ---------- boot ---------- */
resize();
makeEngine();
buildScenery();
starField = Array.from({length:70},()=>({x:Math.random()*W, y:Math.random()*460, r:1.4, a:.6, tw:Math.random()*6.28}));
loadProgress().then(()=>{ showMenu(); updateHUD(); });
requestAnimationFrame(frame);
</script>
</body>
</html>
