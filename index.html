        ctx.moveTo(p.x-30*s, base); ctx.lineTo(p.x, base-42*s); ctx.lineTo(p.x-4*s, base);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,222,150,.55)';
        ctx.beginPath(); ctx.arc(p.x, base-48*s, 2.2, 0, Math.PI*2); ctx.fill();
      });
      break;
    }

    /* ---- Auburn: the corner oaks under paper ---- */
    case 'cornertrees': {
      props.filter(p=>p.kind==='arch').forEach(p=>{
        const s = p.s;
        ctx.fillStyle = 'rgba(38,28,26,.85)';
        ctx.fillRect(p.x-52*s, 470, 104*s, 170);
        ctx.fillStyle = 'rgba(16,12,14,.75)';
        ctx.beginPath();
        ctx.moveTo(p.x-30*s, 640); ctx.lineTo(p.x-30*s, 540);
        ctx.quadraticCurveTo(p.x, 496, p.x+30*s, 540);
        ctx.lineTo(p.x+30*s, 640); ctx.closePath(); ctx.fill();
      });
      props.filter(p=>p.kind==='oak2').forEach(p=>{
        const s = p.s, sway = Math.sin(now*.4 + p.x)*3;
        ctx.fillStyle = 'rgba(24,18,14,.94)';
        ctx.beginPath();
        ctx.moveTo(p.x-11*s, 640); ctx.lineTo(p.x-6*s, 500);
        ctx.lineTo(p.x+6*s, 500); ctx.lineTo(p.x+11*s, 640); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(24,18,14,.94)'; ctx.lineWidth = 7*s; ctx.lineCap='round';
        [-1,1].forEach(d=>{
          ctx.beginPath(); ctx.moveTo(p.x, 512);
          ctx.quadraticCurveTo(p.x+d*54*s, 486, p.x+d*96*s, 452); ctx.stroke();
        });
        [[0,-60,74],[-72,-30,54],[72,-34,52],[-34,-84,46],[38,-86,44]].forEach(([ox,oy,r],k)=>{
          ctx.fillStyle = k%2 ? 'rgba(16,40,26,.92)' : 'rgba(24,58,34,.92)';
          ctx.beginPath(); ctx.arc(p.x+ox*s+sway*(k*.2), 500+oy*s, r*s, 0, Math.PI*2); ctx.fill();
        });
        /* the paper: streamers hanging from every limb */
        ctx.strokeStyle = 'rgba(248,246,240,.72)'; ctx.lineWidth = 3*s; ctx.lineCap='round';
        for (let i=0;i<13;i++){
          const hx = p.x + (i-6)*17*s, top = 470 + Math.abs(i-6)*7;
          const len = 52 + ((i*37)%60);
          ctx.beginPath();
          ctx.moveTo(hx, top);
          for (let k2=1;k2<=3;k2++)
            ctx.lineTo(hx + Math.sin(now*.7 + i + k2)*4*s, top + len*k2/3);
          ctx.stroke();
        }
      });
      break;
    }

    /* ---- Knoxville: smoky ranks, the river, the boat flotilla ---- */
    case 'flotilla': {
      props.filter(p=>p.kind==='smoky').forEach(p=>{
        const b = p.band, base = 420 + b*54, amp = 96 - b*22;
        ctx.fillStyle = ['rgba(74,58,72,.55)','rgba(52,40,52,.72)','rgba(34,26,36,.88)'][b];
        ctx.beginPath(); ctx.moveTo(0, base);
        for (let x=0;x<=W;x+=44)
          ctx.lineTo(x, base - Math.sin(x/(190+b*70) + b*1.7)*amp*.46 - Math.sin(x/61+b)*amp*.16);
        ctx.lineTo(W, 660); ctx.lineTo(0, 660); ctx.closePath(); ctx.fill();
        /* haze band sitting in the valley */
        const hz = ctx.createLinearGradient(0, base-14, 0, base+34);
        hz.addColorStop(0,'rgba(226,206,214,0)');
        hz.addColorStop(.5,'rgba(226,206,214,.15)');
        hz.addColorStop(1,'rgba(226,206,214,0)');
        ctx.fillStyle = hz; ctx.fillRect(0, base-14, W, 48);
      });
      const rv = ctx.createLinearGradient(0,600,0,656);
      rv.addColorStop(0,'rgba(60,64,80,.92)');
      rv.addColorStop(1,'rgba(22,26,36,.92)');
      ctx.fillStyle = rv; ctx.fillRect(0,600,W,56);
      props.filter(p=>p.kind==='raft').forEach(p=>{
        const s = p.s, bob = Math.sin(now*.7 + p.p)*2.4, y = 614 + bob;
        ctx.fillStyle = 'rgba(238,238,242,.9)';
        ctx.beginPath();
        ctx.moveTo(p.x-34*s, y); ctx.lineTo(p.x+34*s, y);
        ctx.quadraticCurveTo(p.x+28*s, y+13*s, p.x+18*s, y+15*s);
        ctx.lineTo(p.x-18*s, y+15*s);
        ctx.quadraticCurveTo(p.x-28*s, y+13*s, p.x-34*s, y); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(210,214,222,.9)';
        ctx.fillRect(p.x-16*s, y-19*s, 32*s, 19*s);
        ctx.strokeStyle = 'rgba(255,130,0,.9)'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(p.x+16*s, y-19*s); ctx.lineTo(p.x+16*s, y-38*s); ctx.stroke();
        ctx.fillStyle = '#FF8200';
        ctx.beginPath();
        ctx.moveTo(p.x+16*s, y-38*s); ctx.lineTo(p.x+34*s, y-33*s); ctx.lineTo(p.x+16*s, y-28*s);
        ctx.closePath(); ctx.fill();
      });
      break;
    }

    /* ---- Gainesville: cypress standing in black water ---- */
    case 'swamp': {
      props.filter(p=>p.kind==='cypress').forEach(p=>{
        const s = p.s, sway = Math.sin(now*.35 + p.p)*2;
        ctx.fillStyle = 'rgba(16,28,20,.94)';
        ctx.beginPath();
        ctx.moveTo(p.x-24*s, 646); ctx.lineTo(p.x-8*s, 470);
        ctx.lineTo(p.x+8*s, 470); ctx.lineTo(p.x+24*s, 646); ctx.closePath(); ctx.fill();
        [[0,-52,58],[-44,-24,42],[44,-28,40],[-18,-78,34],[22,-80,32]].forEach(([ox,oy,r],k)=>{
          ctx.fillStyle = k%2 ? 'rgba(14,44,28,.9)' : 'rgba(22,62,38,.9)';
          ctx.beginPath(); ctx.arc(p.x+ox*s+sway*(k*.2), 470+oy*s, r*s, 0, Math.PI*2); ctx.fill();
        });
      });
      props.filter(p=>p.kind==='moss').forEach(p=>{
        ctx.strokeStyle = 'rgba(150,168,132,.42)'; ctx.lineWidth = 2.2; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(p.x, p.y);
        for (let y=p.y;y<p.y+p.len;y+=18)
          ctx.lineTo(p.x + Math.sin(y/26 + now*.5 + p.p)*5, y+18);
        ctx.stroke();
      });
      const wt = ctx.createLinearGradient(0,614,0,660);
      wt.addColorStop(0,'rgba(14,38,26,.92)');
      wt.addColorStop(1,'rgba(6,18,12,.95)');
      ctx.fillStyle = wt; ctx.fillRect(0,614,W,46);
      ctx.strokeStyle = 'rgba(150,220,170,.13)'; ctx.lineWidth = 2;
      for (let i=0;i<7;i++){
        const y = 620+i*5;
        ctx.beginPath();
        ctx.moveTo(0,y+Math.sin(now*.9+i)*2); ctx.lineTo(W,y+Math.cos(now*.8+i)*2); ctx.stroke();
      }
      break;
    }

    /* ---- Athens: the arch and the bell tower ---- */
    case 'hedgerow': {
      props.filter(p=>p.kind==='belltower').forEach(p=>{
        ctx.fillStyle = 'rgba(30,16,22,.9)';
        ctx.fillRect(p.x-20, 430, 40, 206);
        ctx.beginPath();
        ctx.moveTo(p.x-26, 430); ctx.lineTo(p.x, 386); ctx.lineTo(p.x+26, 430);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,210,170,.28)';
        ctx.fillRect(p.x-9, 452, 18, 24);
      });
      props.filter(p=>p.kind==='archgate').forEach(p=>{
        ctx.fillStyle = 'rgba(26,14,18,.92)';
        ctx.fillRect(p.x-108, 470, 20, 168);
        ctx.fillRect(p.x+88, 470, 20, 168);
        ctx.fillRect(p.x-2, 470, 14, 168);
        ctx.fillRect(p.x-116, 452, 232, 20);
        ctx.fillStyle = 'rgba(255,180,140,.16)';
        ctx.fillRect(p.x-116, 452, 232, 5);
      });
      break;
    }

    /* ---- Norman: elevator, windmill, wheat ---- */
    case 'prairie': {
      props.filter(p=>p.kind==='elevator').forEach(p=>{
        ctx.fillStyle = 'rgba(46,22,20,.9)';
        for (let i=0;i<5;i++) ctx.fillRect(p.x-70+i*30, 470, 28, 168);
        ctx.fillRect(p.x-76, 448, 160, 26);
        ctx.fillStyle = 'rgba(28,12,12,.9)';
        ctx.fillRect(p.x-30, 410, 54, 40);
      });
      props.filter(p=>p.kind==='windmill').forEach(p=>{
        ctx.strokeStyle = 'rgba(40,18,16,.9)'; ctx.lineWidth = 3.4;
        ctx.beginPath();
        ctx.moveTo(p.x-16, 640); ctx.lineTo(p.x-4, 520);
        ctx.moveTo(p.x+16, 640); ctx.lineTo(p.x+4, 520);
        ctx.moveTo(p.x-11, 590); ctx.lineTo(p.x+11, 590);
        ctx.stroke();
        ctx.save(); ctx.translate(p.x, 512); ctx.rotate(now*.9);
        ctx.fillStyle = 'rgba(52,26,22,.9)';
        for (let i=0;i<12;i++){
          ctx.save(); ctx.rotate(i*Math.PI/6);
          ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(4,-26); ctx.lineTo(-4,-26); ctx.closePath(); ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      });
      break;
    }

    /* ---- Austin: skyline and the lit tower ---- */
    case 'austin': {
      props.filter(p=>p.kind==='block').forEach(p=>{
        const top = 636 - p.h;
        ctx.fillStyle = 'rgba(20,14,28,.92)';
        ctx.fillRect(p.x, top, p.w, p.h);
        ctx.fillStyle = 'rgba(190,214,255,.22)';
        for (let wy=top+9; wy<630; wy+=14)
          for (let wx=p.x+5; wx<p.x+p.w-6; wx+=12)
            if ((Math.sin(wx*2.7+wy*1.3+p.seed)+1) > .78) ctx.fillRect(wx, wy, 5, 7);
      });
      props.filter(p=>p.kind==='uttower').forEach(p=>{
        const glow = ctx.createRadialGradient(p.x, 430, 8, p.x, 430, 160);
        glow.addColorStop(0,'rgba(255,140,52,.30)');
        glow.addColorStop(1,'rgba(255,120,40,0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(p.x, 430, 160, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(28,20,34,.95)';
        ctx.fillRect(p.x-32, 636, 64, -220);
        ctx.fillStyle = 'rgba(255,150,64,.85)';
        ctx.fillRect(p.x-32, 416, 64, 34);
        ctx.fillStyle = 'rgba(255,206,150,.9)';
        ctx.fillRect(p.x-22, 396, 44, 20);
        ctx.beginPath();
        ctx.moveTo(p.x-24, 396); ctx.lineTo(p.x, 366); ctx.lineTo(p.x+24, 396);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,190,120,.30)';
        for (let wy=470; wy<630; wy+=18) ctx.fillRect(p.x-18, wy, 36, 8);
      });
      props.filter(p=>p.kind==='liveoak').forEach(p=>{
        const s = p.s;
        ctx.fillStyle = 'rgba(16,10,20,.94)';
        ctx.fillRect(p.x-6*s, 570, 12*s, 70);
        [[0,-30,48],[-36,-8,36],[36,-12,34]].forEach(([ox,oy,r],k)=>{
          ctx.fillStyle = k%2 ? 'rgba(14,26,20,.92)' : 'rgba(20,36,26,.92)';
          ctx.beginPath(); ctx.arc(p.x+ox*s, 570+oy*s, r*s, 0, Math.PI*2); ctx.fill();
        });
      });
      break;
    }

    /* ---- College Station: a wall of standing crowd that visibly moves ---- */
    case 'brazos': {
      const wall = props.find(p=>p.kind==='wall');
      if (wall && !wall.img){
        wall.img = offscreen(W, 330, x=>{
          /* a real hash, not sin banding: sin-based noise reads as diagonal stripes */
          const hash = (a,b)=>{ const v = Math.sin(a*12.9898 + b*78.233)*43758.5453; return v - Math.floor(v); };
          for (let deck=0; deck<3; deck++){
            const top = deck*110, h = 96;
            x.fillStyle = ['rgba(34,6,10,.96)','rgba(46,8,13,.96)','rgba(58,10,16,.96)'][deck];
            x.fillRect(0, top, W, h);
            /* the crowd, standing, two tones so it reads as people */
            for (let cy=top+8; cy<top+h-12; cy+=8)
              for (let cx=3; cx<W; cx+=6){
                const r = hash(cx*0.7, cy*1.3);
                if (r > .60) continue;
                x.fillStyle = r > .28 ? 'rgba(230,224,226,.30)' : 'rgba(104,20,30,.52)';
                x.fillRect(cx, cy, 3.2, 4.6);
              }
            /* deck fascia */
            x.fillStyle = 'rgba(10,3,5,.94)';
            x.fillRect(0, top+h-10, W, 14);
            x.fillStyle = 'rgba(255,190,190,.07)';
            x.fillRect(0, top+h-10, W, 2);
          }
        });
      }
      if (wall && wall.img){
        /* the stands visibly move when the whole crowd jumps */
        const sway = Math.sin(now*1.15)*2.4;
        ctx.globalAlpha = .82;
        ctx.drawImage(wall.img, sway, 268);
        ctx.globalAlpha = 1;
      }
      break;
    }

    /* ---- Tuscaloosa: belfry, colonnade, banners ---- */
    case 'ironworks': {
      props.filter(p=>p.kind==='belfry').forEach(p=>{
        ctx.fillStyle = 'rgba(30,14,22,.92)';
        ctx.fillRect(p.x-24, 402, 48, 234);
        ctx.beginPath();
        ctx.moveTo(p.x-32, 402); ctx.lineTo(p.x, 348); ctx.lineTo(p.x+32, 402);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,196,180,.24)';
        ctx.fillRect(p.x-11, 424, 22, 28);
        ctx.fillStyle = 'rgba(255,196,180,.14)';
        ctx.fillRect(p.x-11, 470, 22, 22);
      });
      props.filter(p=>p.kind==='colonnade').forEach(p=>{
        ctx.fillStyle = 'rgba(38,18,26,.9)';
        ctx.fillRect(p.x-34, 500, 20, 136);
        ctx.fillStyle = 'rgba(18,8,12,.72)';
        ctx.beginPath();
        ctx.moveTo(p.x-14, 636); ctx.lineTo(p.x-14, 550);
        ctx.quadraticCurveTo(p.x+10, 512, p.x+34, 550);
        ctx.lineTo(p.x+34, 636); ctx.closePath(); ctx.fill();
        /* a faint gleam of silverware deep in the arcade */
        ctx.fillStyle = `rgba(255,214,140,${(.10 + .07*Math.sin(now*1.4 + p.x)).toFixed(3)})`;
        ctx.beginPath(); ctx.ellipse(p.x+10, 588, 7, 15, 0, 0, Math.PI*2); ctx.fill();
      });
      props.filter(p=>p.kind==='banner').forEach(p=>{
        const wav = Math.sin(now*1.1 + p.p)*4;
        ctx.fillStyle = 'rgba(158,27,50,.75)';
        ctx.beginPath();
        ctx.moveTo(p.x-16, 300); ctx.lineTo(p.x+16, 300);
        ctx.lineTo(p.x+16+wav, 392); ctx.lineTo(p.x+wav*.5, 380); ctx.lineTo(p.x-16+wav, 392);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.16)';
        ctx.fillRect(p.x-16, 300, 32, 5);
      });
      break;
    }

    /* ---- Baton Rouge: the river, the bridge, the lit bowl ---- */
    case 'levee': {
      const d = props.find(p=>p.kind==='decks');
      if (d && !d.img){
        d.img = offscreen(W, 260, x=>{
          for (let deck=0; deck<2; deck++){
            const top = deck*120, h = 104;
            x.fillStyle = deck ? 'rgba(52,30,92,.92)' : 'rgba(38,20,70,.92)';
            x.beginPath();
            x.moveTo(0, top+26);
            for (let ax=0; ax<=W; ax+=70) x.lineTo(ax, top + (ax/70 % 2 ? 8 : 26));
            x.lineTo(W, top+h); x.lineTo(0, top+h); x.closePath(); x.fill();
            for (let cy=top+34; cy<top+h-6; cy+=9)
              for (let cx=4; cx<W; cx+=7){
                const v = Math.sin(cx*12.9898 + cy*78.233)*43758.5453;
                const r = v - Math.floor(v);
                if (r > .66) continue;
                x.fillStyle = r > .32 ? 'rgba(253,208,35,.38)' : 'rgba(196,172,255,.32)';
                x.fillRect(cx, cy, 4, 5);
              }
          }
        });
      }
      if (d && d.img) ctx.drawImage(d.img, 0, 300);
      props.filter(p=>p.kind==='bridge').forEach(p=>{
        ctx.strokeStyle = 'rgba(20,12,32,.92)'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(p.x-230, 596); ctx.lineTo(p.x+230, 596); ctx.stroke();
        ctx.lineWidth = 4;
        for (let i=-3;i<=3;i++){
          ctx.beginPath();
          ctx.moveTo(p.x+i*66, 596); ctx.lineTo(p.x+i*66, 540);
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.moveTo(p.x-230, 552);
        for (let i=-3;i<=3;i++) ctx.lineTo(p.x+i*66, 540 + (i%2?12:0));
        ctx.lineTo(p.x+230, 552); ctx.stroke();
        ctx.fillStyle = 'rgba(253,208,35,.45)';
        for (let i=-5;i<=5;i++){ ctx.beginPath(); ctx.arc(p.x+i*42, 590, 2, 0, Math.PI*2); ctx.fill(); }
      });
      const rv = ctx.createLinearGradient(0,598,0,656);
      rv.addColorStop(0,'rgba(38,24,66,.92)');
      rv.addColorStop(1,'rgba(14,8,26,.94)');
      ctx.fillStyle = rv; ctx.fillRect(0,598,W,58);
      ctx.strokeStyle = 'rgba(253,208,35,.14)'; ctx.lineWidth = 2;
      for (let i=0;i<8;i++){
        const y = 604+i*5;
        ctx.beginPath();
        ctx.moveTo(0,y+Math.sin(now*.9+i)*2); ctx.lineTo(W,y+Math.cos(now*.75+i)*2); ctx.stroke();
      }
      props.filter(p=>p.kind==='litoak').forEach(p=>{
        const s = p.s, sway = Math.sin(now*.4 + p.p)*2;
        ctx.fillStyle = 'rgba(14,8,22,.94)';
        ctx.fillRect(p.x-7*s, 556, 14*s, 84);
        [[0,-40,54],[-40,-16,40],[40,-20,38]].forEach(([ox,oy,r],k)=>{
          ctx.fillStyle = k%2 ? 'rgba(16,30,20,.92)' : 'rgba(24,44,28,.92)';
          ctx.beginPath(); ctx.arc(p.x+ox*s+sway*(k*.2), 556+oy*s, r*s, 0, Math.PI*2); ctx.fill();
        });
        ctx.fillStyle = 'rgba(255,232,150,.75)';
        for (let i=0;i<7;i++){
          const a2 = i*.9 + p.p;
          ctx.beginPath();
          ctx.arc(p.x + Math.cos(a2)*48*s + sway, 540 + Math.sin(a2)*30*s, 2.2, 0, Math.PI*2);
          ctx.fill();
        }
      });
      break;
    }
  }
  ctx.restore();
}

function spawnAmbient(){
  const t = theme();
  if (reduced || !t.ambient) return;
  const r = Math.random();
  switch(t.ambient){
    case 'bubbles': if (r<.5) motes.push({x:Math.random()*W, y:GROUND_Y, vx:(Math.random()-.5)*.3, vy:-.7-Math.random()*1.1, r:1.5+Math.random()*4, life:1, kind:'bubble'}); break;
    case 'embers':  if (r<.6) motes.push({x:Math.random()*W, y:GROUND_Y, vx:(Math.random()-.5)*.8, vy:-.9-Math.random()*1.4, r:1+Math.random()*2.4, life:1, kind:'ember'}); break;
    case 'motes':   if (r<.22) motes.push({x:Math.random()*W, y:200+Math.random()*500, vx:.25+Math.random()*.4, vy:-.12, r:1+Math.random()*1.8, life:1, kind:'mote'}); break;
    case 'sand':
      /* Waved towels belong in the gust, not drifting alone through the sky, where a
         single big one reads as a flying pillow. Small, fast and many. */
      if (gust > 0 && r < .30) motes.push({x:-30, y:250+Math.random()*330,
        vx:3.6+Math.random()*3.6, vy:(Math.random()-.5)*.7, r:4.5+Math.random()*5,
        life:1, kind:'cloth', p:Math.random()*6.28, spin:(Math.random()-.5)*.16});
      if (r < (gust > 0 ? .96 : .5)) motes.push({x:-10, y:200+Math.random()*520, vx:1.6+Math.random()*2.2, vy:.05, r:.8+Math.random()*1.6, life:1, kind:'sand'}); break;
    case 'snow':    if (r<.5) motes.push({x:Math.random()*W, y:-10, vx:(Math.random()-.5)*.5, vy:.6+Math.random()*.8, r:1+Math.random()*2.4, life:1, kind:'snow'}); break;
    case 'spores':  if (r<.34) motes.push({x:Math.random()*W, y:200+Math.random()*500, vx:.15+Math.random()*.35, vy:-.10-Math.random()*.18, r:1.2+Math.random()*2.2, life:1, kind:'spore'}); break;
    case 'sparks':  if (r<.5) motes.push({x:Math.random()*W, y:GROUND_Y-Math.random()*90, vx:(Math.random()-.5)*1.3, vy:-1.1-Math.random()*1.6, r:.9+Math.random()*1.8, life:1, kind:'spark'}); break;
    case 'rain':    if (r<.92) motes.push({x:Math.random()*W*1.2-100, y:-10, vx:2.4+Math.random()*1.2, vy:11+Math.random()*5, r:1, life:1, kind:'rain', len:12+Math.random()*14}); break;
    case 'glimmer': if (r<.30) motes.push({x:Math.random()*W, y:150+Math.random()*520, vx:(Math.random()-.5)*.22, vy:-.16-Math.random()*.22, r:1+Math.random()*2, life:1, kind:'glimmer', p:Math.random()*6.28}); break;
    case 'gulls':   if (r<.012) motes.push({x:-30, y:120+Math.random()*220, vx:.9+Math.random()*.7, vy:0, r:7, life:1, kind:'gull', p:Math.random()*6.28}); break;
    case 'leaves':  if (r<.30) motes.push({x:Math.random()*W, y:-10, vx:-.5-Math.random()*1.5, vy:.7+Math.random()*1.1, r:3+Math.random()*3, life:1, kind:'leaf', p:Math.random()*6.28, hue:12+Math.random()*32}); break;
    case 'tp':      if (r<.16) motes.push({x:Math.random()*W, y:-10, vx:(Math.random()-.5)*.7, vy:.45+Math.random()*.5, r:2.6+Math.random()*2, life:1, kind:'tp', p:Math.random()*6.28, len:14+Math.random()*20}); break;
    case 'mist':    if (r<.12) motes.push({x:-140, y:380+Math.random()*230, vx:.35+Math.random()*.45, vy:-.02, r:40+Math.random()*70, life:1, kind:'mist'}); break;
    case 'fireflies': if (r<.20) motes.push({x:Math.random()*W, y:380+Math.random()*280, vx:(Math.random()-.5)*.5, vy:-.10-Math.random()*.18, r:1.6+Math.random()*1.6, life:1, kind:'fly', p:Math.random()*6.28}); break;
    case 'wheat':   if (r<.55) motes.push({x:-10, y:300+Math.random()*380, vx:2.6+Math.random()*3.0, vy:.10, r:1.2+Math.random()*2, life:1, kind:'chaff', p:Math.random()*6.28}); break;
  }
}
function stepAmbient(){
  motes.forEach(m=>{
    m.x += m.vx; m.y += m.vy;
    if (m.kind === 'bubble'){ m.x += Math.sin(m.y/28)*.4; m.life -= .0035; }
    else if (m.kind === 'ember'){ m.vy *= .995; m.life -= .006; }
    else if (m.kind === 'snow'){ m.x += Math.sin(m.y/40)*.3; if (m.y > GROUND_Y) m.life = 0; }
    else if (m.kind === 'gull'){ m.y += Math.sin((m.p += .06))*.7; if (m.x > W+40) m.life = 0; }
    else if (m.kind === 'sand'){ if (m.x > W+20) m.life = 0; }
    else if (m.kind === 'spore'){ m.x += Math.sin(m.y/34 + m.r)*.35; m.life -= .0030; }
    else if (m.kind === 'spark'){ m.vy *= .985; m.vx *= .99; m.life -= .016; }
    else if (m.kind === 'rain'){ if (m.y > GROUND_Y - 6) m.life = 0; }
    else if (m.kind === 'glimmer'){ m.p += .07; m.life -= .0035; }
    else if (m.kind === 'leaf'){ m.p += .09; m.x += Math.sin(m.p)*1.1; if (m.y > GROUND_Y-4) m.life = 0; }
    else if (m.kind === 'tp'){ m.p += .05; m.x += Math.sin(m.p)*.7; if (m.y > GROUND_Y-4) m.life = 0; }
    else if (m.kind === 'mist'){ m.life -= .0022; if (m.x > W+180) m.life = 0; }
    else if (m.kind === 'fly'){ m.p += .10; m.x += Math.sin(m.p*.6)*.5; m.life -= .0028; }
    else if (m.kind === 'chaff'){ m.p += .12; m.y += Math.sin(m.p)*.6; if (m.x > W+20) m.life = 0; }
    else if (m.kind === 'cloth'){ m.p += .24; m.y += Math.sin(m.p*.7)*1.2; if (m.x > W+40) m.life = 0; }
    else m.life -= .002;
    if (m.y < -20) m.life = 0;
  });
  motes = motes.filter(m=>m.life > 0);
}
function drawAmbient(){
  motes.forEach(m=>{
    ctx.globalAlpha = Math.min(m.life, .85);
    if (m.kind === 'bubble'){
      ctx.strokeStyle = 'rgba(210,255,255,.75)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI*2); ctx.stroke();
    } else if (m.kind === 'gull'){
      ctx.strokeStyle = 'rgba(255,240,220,.8)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      const f = Math.sin(m.p)*5;
      ctx.beginPath();
      ctx.moveTo(m.x-9, m.y+f); ctx.quadraticCurveTo(m.x, m.y-4, m.x+9, m.y+f); ctx.stroke();
    } else if (m.kind === 'rain'){
      ctx.strokeStyle = 'rgba(180,215,245,.5)'; ctx.lineWidth = 1.3; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.len*.22, m.y + m.len); ctx.stroke();
    } else if (m.kind === 'glimmer'){
      const tw = .35 + .65*Math.abs(Math.sin(m.p));
      ctx.fillStyle = `rgba(226,196,255,${(tw*.85).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = `rgba(255,240,255,${(tw*.4).toFixed(3)})`; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(m.x-m.r*2.4,m.y); ctx.lineTo(m.x+m.r*2.4,m.y);
      ctx.moveTo(m.x,m.y-m.r*2.4); ctx.lineTo(m.x,m.y+m.r*2.4); ctx.stroke();
    } else if (m.kind === 'leaf'){
      ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.p);
      ctx.fillStyle = `hsl(${m.hue|0}, 76%, 48%)`;
      ctx.beginPath(); ctx.ellipse(0, 0, m.r, m.r*.5, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(60,26,10,.5)'; ctx.lineWidth = .8;
      ctx.beginPath(); ctx.moveTo(-m.r,0); ctx.lineTo(m.r,0); ctx.stroke();
      ctx.restore();
    } else if (m.kind === 'tp'){
      ctx.strokeStyle = 'rgba(248,246,240,.72)'; ctx.lineWidth = m.r; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.quadraticCurveTo(m.x + Math.sin(m.p)*7, m.y + m.len*.5, m.x + Math.sin(m.p+1)*5, m.y + m.len);
      ctx.stroke();
    } else if (m.kind === 'mist'){
      const mg = ctx.createRadialGradient(m.x, m.y, 1, m.x, m.y, m.r);
      mg.addColorStop(0, `rgba(226,210,216,${(m.life*.16).toFixed(3)})`);
      mg.addColorStop(1, 'rgba(226,210,216,0)');
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.ellipse(m.x, m.y, m.r, m.r*.34, 0, 0, Math.PI*2); ctx.fill();
    } else if (m.kind === 'fly'){
      const tw = Math.max(0, Math.sin(m.p*.9));
      ctx.fillStyle = `rgba(214,255,140,${(tw*.9).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = `rgba(180,255,120,${(tw*.18).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r*3.4, 0, Math.PI*2); ctx.fill();
    } else if (m.kind === 'cloth'){
      /* a limp rag whipping past, not a rigid card */
      ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(Math.sin(m.p)*.42 + m.spin*m.p);
      const w2 = m.r*1.7, h2 = m.r*.62, f = Math.sin(m.p);
      ctx.fillStyle = `rgba(252,252,250,${(m.life*.8).toFixed(3)})`;
      ctx.beginPath();
      ctx.moveTo(-w2, -h2*.7);
      ctx.quadraticCurveTo(0, -h2 + f*h2*1.5, w2, -h2*.5);
      ctx.quadraticCurveTo(w2*.7, 0, w2, h2*.5);
      ctx.quadraticCurveTo(0, h2 + Math.sin(m.p+1.4)*h2*1.5, -w2, h2*.7);
      ctx.quadraticCurveTo(-w2*.7, 0, -w2, -h2*.7);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = `rgba(140,10,30,${(m.life*.45).toFixed(3)})`;
      ctx.lineWidth = Math.max(.8, m.r*.14);
      ctx.beginPath();
      ctx.moveTo(-w2*.72, -h2*.15); ctx.quadraticCurveTo(0, f*h2*.8, w2*.72, -h2*.05);
      ctx.stroke();
      ctx.restore();
    } else if (m.kind === 'chaff'){
      ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.p*.5);
      ctx.fillStyle = 'rgba(240,214,140,.7)';
      ctx.fillRect(-m.r*2, -m.r*.4, m.r*4, m.r*.8);
      ctx.restore();
    } else if (m.kind === 'spore'){
      ctx.fillStyle = 'rgba(196,255,170,.55)';
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI*2); ctx.fill();
    } else if (m.kind === 'spark'){
      ctx.fillStyle = `hsl(${28+Math.random()*18}, 100%, ${58+Math.random()*22}%)`;
      ctx.fillRect(m.x, m.y, m.r, m.r*1.8);
    } else {
      ctx.fillStyle = m.kind === 'ember' ? `hsl(${18+Math.random()*22}, 95%, 62%)`
                    : m.kind === 'snow'  ? 'rgba(255,255,255,.9)'
                    : m.kind === 'sand'  ? 'rgba(240,210,150,.6)'
                    : 'rgba(255,240,190,.8)';
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI*2); ctx.fill();
    }
  });
  ctx.globalAlpha = 1;
}


/* ============================================================
   FAUNA — creatures that cross the scene, one cast per world
   ============================================================ */
let fauna = [];
const rnd = ([a,b])=>a + Math.random()*(b-a);

function spawnFauna(){
  const t = theme();
  if (reduced || !t.fauna || fauna.length > 7) return;
  t.fauna.forEach(f=>{
    if (Math.random() > f.p) return;
    const dir = (f.kind==='birds'||f.kind==='dove'||f.kind==='hawk'||f.kind==='heron') && Math.random()<.4 ? -1 : 1;
    fauna.push({
      kind:f.kind, dir,
      x: dir === 1 ? -110 : W + 110,
      y: rnd(f.y), base: 0, s: rnd(f.s), v: rnd(f.v) * dir,
      phase: Math.random()*6.28, life:1
    });
    /* a firework does not travel, so it is placed rather than launched from the wing */
    if (f.kind === 'fireworks'){
      const o = fauna[fauna.length-1];
      o.x = 160 + Math.random()*(W-320); o.v = 0; o.dir = 1;
    }
  });
}
function stepFauna(){
  fauna.forEach(f=>{
    f.x += f.v; f.phase += .07;
    if (f.kind === 'dolphin')      f.base = -Math.abs(Math.sin(f.phase*.5))*70;
    else if (f.kind === 'butterfly') f.base = Math.sin(f.phase*.9)*16;
    else if (f.kind === 'mermaid')   f.base = Math.sin(f.phase*.45)*14;
    else if (f.kind === 'whale')     f.base = Math.sin(f.phase*.25)*12;
    else if (f.kind === 'shootingstar'){ f.y += Math.abs(f.v)*.42; f.life -= .014; }
    else if (f.kind === 'fireworks'){ f.life -= .017; }
    else if (f.kind === 'eagle' || f.kind === 'hawk') f.base = Math.sin(f.phase*.32)*20;
    else if (f.kind === 'heron') f.base = Math.sin(f.phase*.5)*9;
    else if (f.kind === 'sharkfin') f.base = Math.sin(f.phase*.7)*3;
    else if (f.kind === 'gator') f.base = Math.sin(f.phase*.45)*2.5;
    else if (f.kind === 'boat' || f.kind === 'riverboat') f.base = Math.sin(f.phase*.6)*2.5;
    if (f.x < -180 || f.x > W + 180) f.life = 0;
  });
  fauna = fauna.filter(f=>f.life > 0);
}
function drawFauna(){
  fauna.forEach(f=>{
    ctx.save();
    ctx.translate(f.x, f.y + f.base);
    ctx.scale(f.dir * f.s, f.s);
    ctx.globalAlpha = Math.min(1, f.life);
    const fn = CREATURE[f.kind]; if (fn) fn(f.phase, f);
    ctx.restore();
  });
  ctx.globalAlpha = 1;
}

/* ---------- small painting helpers shared by the creature library ---------- */
function lin(x0,y0,x1,y1,stops){
  const g = ctx.createLinearGradient(x0,y0,x1,y1);
  stops.forEach(([o,c])=>g.addColorStop(o,c));
  return g;
}
function rad(x,y,r0,x1,y1,r1,stops){
  const g = ctx.createRadialGradient(x,y,r0,x1,y1,r1);
  stops.forEach(([o,c])=>g.addColorStop(o,c));
  return g;
}
/* a tapered ribbon along a sine path: hair, tails, streamers */
function ribbon(x0,y0,len,amp,freq,phase,w0,w1,color){
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i=0;i<=12;i++){
    const t = i/12, x = x0 + len*t, y = y0 + Math.sin(phase + t*freq)*amp*t;
    const w = w0 + (w1-w0)*t;
    if (i===0) ctx.moveTo(x, y-w); else ctx.lineTo(x, y-w);
  }
  for (let i=12;i>=0;i--){
    const t = i/12, x = x0 + len*t, y = y0 + Math.sin(phase + t*freq)*amp*t;
    const w = w0 + (w1-w0)*t;
    ctx.lineTo(x, y+w);
  }
  ctx.closePath(); ctx.fill();
}

const CREATURE = {
  birds(p){
    [[0,0,1],[-30,14,.85],[26,16,.8]].forEach(([ox,oy,sc],i)=>{
      const f = Math.sin(p*1.3 + i*.8);
      ctx.save(); ctx.translate(ox,oy); ctx.scale(sc,sc);
      ctx.fillStyle = 'rgba(248,238,224,.9)';
      ctx.beginPath(); ctx.ellipse(0,0,7,3.2,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-1,-1);
      ctx.quadraticCurveTo(-8,-9-f*7,-17,-4-f*5);
      ctx.quadraticCurveTo(-8,0,-1,1); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(1,-1);
      ctx.quadraticCurveTo(8,-9-f*7,17,-4-f*5);
      ctx.quadraticCurveTo(8,0,1,1); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(-12,-2.5); ctx.lineTo(-12,2.5); ctx.fill();
      ctx.restore();
    });
  },

  dove(p){
    const f = Math.sin(p*1.7);
    ctx.fillStyle = lin(0,-10,0,10,[[0,'#ffffff'],[1,'#cfd8ea']]);
    ctx.beginPath(); ctx.ellipse(0,0,14,6.5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(12,-4,5.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8a33c';
    ctx.beginPath(); ctx.moveTo(16,-4); ctx.lineTo(22,-2.6); ctx.lineTo(16,-1.4); ctx.fill();
    /* far wing then near wing for depth */
    ctx.fillStyle = 'rgba(196,206,226,.9)';
    ctx.beginPath(); ctx.moveTo(-1,-2);
    ctx.quadraticCurveTo(4,-12-f*8,14,-6-f*7);
    ctx.quadraticCurveTo(5,-1,-1,-2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(-2,-2);
    ctx.quadraticCurveTo(6,-17-f*11,19,-6-f*9);
    ctx.quadraticCurveTo(6,-2,-2,-2); ctx.fill();
    ctx.strokeStyle = 'rgba(150,165,195,.55)'; ctx.lineWidth = .9;
    for (let i=0;i<3;i++){
      ctx.beginPath(); ctx.moveTo(1+i*3,-4);
      ctx.quadraticCurveTo(8+i*3,-12-f*7,15+i*2,-6-f*7); ctx.stroke();
    }
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(-13,-1); ctx.lineTo(-25,-6); ctx.lineTo(-24,0);
    ctx.lineTo(-25,6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#33405c';
    ctx.beginPath(); ctx.arc(13.5,-5,1.3,0,Math.PI*2); ctx.fill();
  },

  butterfly(p){
    const f = Math.abs(Math.sin(p*1.9)), open = f*.5 + .55;
    ctx.scale(1.3,1.3);
    /* far pair, dimmed and tucked in */
    ctx.globalAlpha *= .45;
    [-1,1].forEach(s=>{
      ctx.fillStyle = '#b8603a';
      ctx.beginPath(); ctx.ellipse(s*7*open,-4, 8*open, 10, s*.5, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha /= .45;
    /* near pair: forewing and hindwing, spread clear of the body */
    [-1,1].forEach(s=>{
      /* forewing */
      ctx.fillStyle = lin(0,-16,0,4,[[0,'#ffe0ac'],[.45,'#ff9f4d'],[1,'#dd5f34']]);
      ctx.beginPath();
      ctx.moveTo(s*1.5,-6);
      ctx.quadraticCurveTo(s*10*open,-20, s*17*open,-13);
      ctx.quadraticCurveTo(s*20*open,-4, s*8*open,-1);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(74,34,20,.8)'; ctx.lineWidth = 1; ctx.stroke();

      ctx.fillStyle = lin(0,0,0,14,[[0,'#f4863c'],[1,'#c34430']]);
      ctx.beginPath();
      ctx.moveTo(s*1.5,-1);
      ctx.quadraticCurveTo(s*13*open,2, s*12*open,10);
      ctx.quadraticCurveTo(s*7*open,15, s*2,6);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(74,34,20,.75)'; ctx.stroke();
      /* veins */
      ctx.strokeStyle = 'rgba(74,34,20,.45)'; ctx.lineWidth = .7;
      for (let i=0;i<3;i++){
        ctx.beginPath(); ctx.moveTo(s*2,-5);
        ctx.lineTo(s*(8+i*4)*open, -14+i*5); ctx.stroke();
      }
      /* eyespots */
      ctx.fillStyle = 'rgba(255,248,214,.95)';
      ctx.beginPath(); ctx.arc(s*13*open,-10, 2.1, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(58,28,18,.7)';
      ctx.beginPath(); ctx.arc(s*13*open,-10, .95, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,238,190,.75)';
      ctx.beginPath(); ctx.arc(s*9*open, 7, 1.5, 0, Math.PI*2); ctx.fill();
    });
    /* body and antennae */
    ctx.fillStyle = lin(0,-12,0,12,[[0,'#4a2f20'],[1,'#241610']]);
    ctx.beginPath(); ctx.ellipse(0,0,1.9,11,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0,-11,2.4,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#3a2418'; ctx.lineWidth = .9; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(-.6,-12); ctx.quadraticCurveTo(-5,-19,-8,-17);
    ctx.moveTo(.6,-12); ctx.quadraticCurveTo(5,-19,8,-17); ctx.stroke();
    ctx.fillStyle = '#3a2418';
    ctx.beginPath(); ctx.arc(-8,-17,1,0,Math.PI*2); ctx.arc(8,-17,1,0,Math.PI*2); ctx.fill();
  },

  fish(p){
    const hues = [34, 18, 46, 8, 28];
    for (let i=0;i<5;i++){
      const ox = (i%3)*22 - 22, oy = Math.sin(p + i*1.3)*8 + (i>2?14:0);
      const sc = i>2 ? .85 : 1, h = hues[i];
      ctx.save(); ctx.translate(ox,oy); ctx.scale(sc,sc);

      ctx.beginPath(); ctx.ellipse(0,0,8,3.8,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = `hsla(${h}, 90%, 80%, .8)`;
      ctx.beginPath(); ctx.moveTo(-1,-3.4); ctx.lineTo(3,-7); ctx.lineTo(5,-2.8); ctx.fill();
      ctx.fillStyle = '#2b1a12';
      ctx.beginPath(); ctx.arc(5.2,-.8,1.1,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.beginPath(); ctx.ellipse(1,-1.8,4,1.1,-.12,0,Math.PI*2); ctx.fill();

    }

  dolphin(p){
    ctx.rotate(Math.cos(p*.5)*.5);

    /* rostrum */

    ctx.beginPath(); ctx.moveTo(36,-2); ctx.quadraticCurveTo(48,0,50,2);
    ctx.quadraticCurveTo(42,4,34,3); ctx.closePath(); ctx.fill();
    /* dorsal fin */
    ctx.fillStyle = '#3f6d92';
    ctx.beginPath(); ctx.moveTo(0,-9); ctx.quadraticCurveTo(8,-27,20,-7);
    ctx.quadraticCurveTo(10,-11,0,-9); ctx.fill();
    /* flukes */
    ctx.beginPath();
    ctx.moveTo(-27,0); ctx.quadraticCurveTo(-40,-6,-48,-14);
    ctx.quadraticCurveTo(-40,-3,-40,0);
    ctx.quadraticCurveTo(-40,3,-48,14);
    ctx.quadraticCurveTo(-40,6,-27,0); ctx.fill();
    /* near pectoral */
    ctx.fillStyle = '#5f92b8';
    ctx.beginPath(); ctx.moveTo(8,6); ctx.quadraticCurveTo(2,22,-10,20);
    ctx.quadraticCurveTo(0,10,8,6); ctx.fill();
    /* sheen, eye, smile */
    ctx.fillStyle = 'rgba(255,255,255,.32)';
    ctx.beginPath(); ctx.ellipse(8,-6,18,2.6,-.08,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#10293a';

      ctx.quadraticCurveTo(s*16,-24-f*16, s*36,-6-f*10);
      ctx.quadraticCurveTo(s*16,-2, 0,0);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(120,155,185,.6)'; ctx.lineWidth = .9;
      for (let i=1;i<=3;i++){
        ctx.beginPath(); ctx.moveTo(s*4,-2);

    ctx.strokeStyle = 'rgba(110,150,180,.7)'; ctx.lineWidth = 1.3; ctx.stroke();
    ctx.fillStyle = 'rgba(120,150,178,.45)';

    /* facial disc */
    ctx.fillStyle = '#fbfdff';
    ctx.beginPath(); ctx.ellipse(0,-5,11,9,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(140,170,196,.6)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(0,-5,11,9,0,0,Math.PI*2); ctx.stroke();
    /* ear tufts */
    ctx.fillStyle = '#dde8f2';
    ctx.beginPath(); ctx.moveTo(-10,-10); ctx.lineTo(-6,-20); ctx.lineTo(-2,-10); ctx.fill();

      ctx.beginPath(); ctx.arc(x,-5,2.2,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath(); ctx.arc(x+.9,-5.9,.8,0,Math.PI*2); ctx.fill();
    });
    ctx.fillStyle = '#e8a33c';
    ctx.beginPath(); ctx.moveTo(0,-3); ctx.lineTo(2,1); ctx.lineTo(-2,1); ctx.fill();
  },

  macaw(p){

  petrel(p){

    ctx.beginPath();

    ctx.quadraticCurveTo(16,2,1,1); ctx.fill();

  bat(p){
    const f = Math.sin(p*2.4);
    ctx.fillStyle = 'rgba(38,24,56,.95)';
    /* membranes with finger struts */
    [[-1,.85],[1,1]].forEach(([s,a])=>{
      ctx.globalAlpha *= a;
      ctx.fillStyle = 'rgba(52,32,74,.95)';
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.quadraticCurveTo(s*14,-16-f*12, s*32,-6-f*9);
      ctx.quadraticCurveTo(s*24,-1, s*20,3);
      ctx.quadraticCurveTo(s*12,0, s*8,5);

      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(24,14,36,.9)'; ctx.lineWidth = 1.2;
      for (let i=1;i<=3;i++){
        ctx.beginPath(); ctx.moveTo(0,0);

      }
      ctx.globalAlpha /= a;
    });

    ctx.beginPath(); ctx.ellipse(0,2,7,8,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0,-7,5.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-5,-10); ctx.lineTo(-7,-19); ctx.lineTo(-1,-12); ctx.fill();
    ctx.beginPath(); ctx.moveTo(5,-10); ctx.lineTo(7,-19); ctx.lineTo(1,-12); ctx.fill();
    ctx.fillStyle = '#c58cff';
    ctx.beginPath(); ctx.arc(-2.2,-7,1.2,0,Math.PI*2); ctx.arc(2.2,-7,1.2,0,Math.PI*2); ctx.fill();

  wisp(p){
    const tw = .55 + .45*Math.sin(p*2.2);
    /* trailing motes */
    for (let i=0;i<5;i++){
      const t = (i+1)/6;
      ctx.globalAlpha *= (1-t)*.8;
      ctx.fillStyle = 'rgba(214,170,255,.9)';
      ctx.beginPath();
      ctx.arc(-t*38, Math.sin(p*1.6 - t*3)*7, 2.6*(1-t)+.7, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha /= (1-t)*.8 || 1;
    }
    const halo = rad(0,0,0, 0,0,22,
      [[0,`rgba(248,236,255,${(.95*tw).toFixed(3)})`],
       [.3,`rgba(198,140,255,${(.55*tw).toFixed(3)})`],
       [1,'rgba(150,90,220,0)']]);
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0,0,22,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fdf6ff';
    ctx.beginPath(); ctx.arc(0,0,3.6*tw+1.4,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = `rgba(240,220,255,${(.5*tw).toFixed(3)})`; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-11,0); ctx.lineTo(11,0); ctx.moveTo(0,-11); ctx.lineTo(0,11); ctx.stroke();
  },

  /* One side-view quadruped carries most of the cast. Proportions and colour change
     per animal; the gait and the build order do not. */
  _quad(p, o){
    const g = o.gait || 1.7, L = o.len, Hh = o.ht, lg = o.leg;
    const sw = Math.sin(p*g), sw2 = Math.sin(p*g + 2.2);
    const dark = o.dark, body = o.body;
    /* far legs */
    ctx.strokeStyle = mix(body, dark, .6); ctx.lineWidth = o.legW || 4.4; ctx.lineCap = 'round';
    [[-L*.52, sw2],[L*.44, -sw2]].forEach(([lx,k])=>{
      ctx.beginPath(); ctx.moveTo(lx, Hh*.4);
      ctx.quadraticCurveTo(lx+k*3, Hh*.4+lg*.55, lx+k*7, Hh*.4+lg); ctx.stroke();
    });
    /* tail */
    if (o.tail === 'thin'){
      ctx.strokeStyle = mix(body, dark, .35); ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(-L*.95, -Hh*.3);
      ctx.quadraticCurveTo(-L*1.3, -Hh*.1+sw*3, -L*1.25, Hh*.7+sw*4); ctx.stroke();
    } else if (o.tail === 'tuft'){
      ctx.strokeStyle = mix(body, dark, .3); ctx.lineWidth = 3.4;
      ctx.beginPath(); ctx.moveTo(-L*.95, -Hh*.3);
      ctx.quadraticCurveTo(-L*1.25, Hh*.1, -L*1.2, Hh*.6+sw*3); ctx.stroke();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.ellipse(-L*1.2, Hh*.75+sw*3, 3.4, 5.4, 0, 0, Math.PI*2); ctx.fill();
    } else if (o.tail === 'plume'){
      ctx.fillStyle = mix(body,'#ffffff',.5);
      ctx.beginPath();
      ctx.moveTo(-L*.9, -Hh*.2);
      ctx.quadraticCurveTo(-L*1.5, -Hh*.9+sw*4, -L*1.35, Hh*.5+sw*5);
      ctx.quadraticCurveTo(-L*1.1, Hh*.1, -L*.9, Hh*.2); ctx.closePath(); ctx.fill();
    }
    /* barrel */
    ctx.fillStyle = lin(0,-Hh,0,Hh,[[0,mix(body,'#ffffff',.24)],[.6,body],[1,mix(body,dark,.45)]]);
    ctx.beginPath(); ctx.ellipse(0, 0, L, Hh, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = mix(body, dark, .55); ctx.lineWidth = 1.6; ctx.stroke();
    if (o.belly){
      ctx.fillStyle = o.belly;
      ctx.beginPath(); ctx.ellipse(0, Hh*.42, L*.72, Hh*.42, 0, 0, Math.PI*2); ctx.fill();
    }
    /* near legs */
    ctx.strokeStyle = mix(body, dark, .3); ctx.lineWidth = (o.legW || 4.4) + .8;
    [[-L*.44, -sw],[L*.52, sw]].forEach(([lx,k])=>{
      ctx.beginPath(); ctx.moveTo(lx, Hh*.4);
      ctx.quadraticCurveTo(lx+k*3, Hh*.4+lg*.55, lx+k*8, Hh*.4+lg); ctx.stroke();
    });
    /* neck and head */
    const hx = o.hx !== undefined ? o.hx : L*.92, hy = o.hy !== undefined ? o.hy : -Hh*1.15;
    ctx.strokeStyle = body; ctx.lineWidth = o.neckW || Hh*.95; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(L*.55, -Hh*.35); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.fillStyle = mix(body,'#ffffff',.12);
    ctx.beginPath(); ctx.ellipse(hx, hy, o.head*1.15, o.head, o.headTilt||0, 0, Math.PI*2); ctx.fill();
    if (o.snout){
      ctx.fillStyle = o.snout;
      ctx.beginPath(); ctx.ellipse(hx + o.head*1.05, hy + o.head*.28, o.head*.55, o.head*.42, 0, 0, Math.PI*2); ctx.fill();
    }
    /* ears */
    ctx.fillStyle = mix(body, dark, .25);
    if (o.ears === 'up'){
      [[-.5,-1],[.35,-1]].forEach(([ex])=>{
        ctx.beginPath();
        ctx.moveTo(hx+ex*o.head, hy-o.head*.7); ctx.lineTo(hx+ex*o.head+o.head*.15, hy-o.head*2);
        ctx.lineTo(hx+ex*o.head+o.head*.7, hy-o.head*.6); ctx.closePath(); ctx.fill();
      });
    } else if (o.ears === 'flop'){
      ctx.beginPath();
      ctx.ellipse(hx-o.head*.35, hy+o.head*.35, o.head*.36, o.head*.85, .25, 0, Math.PI*2); ctx.fill();
    } else if (o.ears === 'round'){
      ctx.beginPath(); ctx.arc(hx-o.head*.5, hy-o.head*.75, o.head*.42, 0, Math.PI*2); ctx.fill();
    }
    if (o.horns === 'long'){
      ctx.strokeStyle = '#e8dcc0'; ctx.lineWidth = 3.6; ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(hx-o.head*.2, hy-o.head*.6);
      ctx.quadraticCurveTo(hx-o.head*2.2, hy-o.head*1.5, hx-o.head*3.2, hy-o.head*.3);
      ctx.moveTo(hx+o.head*.2, hy-o.head*.6);
      ctx.quadraticCurveTo(hx+o.head*2.0, hy-o.head*1.5, hx+o.head*2.9, hy-o.head*.3);
      ctx.stroke();
    }
    if (o.horns === 'nub'){
      ctx.fillStyle = '#d8ccae';
      ctx.beginPath(); ctx.arc(hx-o.head*.55, hy-o.head*.85, o.head*.22, 0, Math.PI*2);
      ctx.arc(hx+o.head*.55, hy-o.head*.85, o.head*.22, 0, Math.PI*2); ctx.fill();
    }
    /* eye */
    ctx.fillStyle = '#12100e';
    ctx.beginPath(); ctx.arc(hx + o.head*.42, hy - o.head*.12, o.head*.17, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(hx + o.head*.5, hy - o.head*.24, o.head*.07, 0, Math.PI*2); ctx.fill();
    /* stripes for the big cats */
    if (o.stripes){
      ctx.strokeStyle = dark; ctx.lineWidth = 2.6; ctx.lineCap='round';
      for (let i=-2;i<=2;i++){
        ctx.beginPath();
        ctx.moveTo(i*L*.28, -Hh*.85); ctx.lineTo(i*L*.28 + 3, -Hh*.25); ctx.stroke();
      }
    }
  },

  rooster(p){

    ctx.quadraticCurveTo(-18,-12,-8,-6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = lin(0,-14,0,10,[[0,'#a81828'],[1,'#5e0c14']]);
    ctx.beginPath(); ctx.ellipse(0,0,13,10,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#8a1420';
    ctx.beginPath(); ctx.ellipse(9,-11+bob,7,7.5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#C4172B';
    [[6,-19],[10,-21],[14,-19]].forEach(([cx,cy])=>{
      ctx.beginPath(); ctx.arc(cx,cy+bob,3.4,Math.PI,0); ctx.fill();
    });
    ctx.beginPath(); ctx.ellipse(8,-5+bob,3,4,0,0,Math.PI*2); ctx.fill();
